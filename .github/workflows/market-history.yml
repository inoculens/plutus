name: Refresh public market history

on:
  schedule:
    - cron: "25 4 * * *"
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "app.js"
      - "scripts/collect-market-history.py"
      - "tests/test_market_history_collector.py"
      - ".github/workflows/market-history.yml"

permissions:
  contents: write

# One writer at a time, including scheduled/manual/dev-triggered runs.
concurrency:
  group: plutus-market-history-archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the canonical dev source
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CCXT
        run: python -m pip install --disable-pip-version-check "ccxt>=4.4,<5"

      - name: Verify collector and application syntax
        run: |
          python -m py_compile scripts/collect-market-history.py
          python -m unittest discover -s tests -p 'test_market_history_collector.py'
          node --check app.js

      - name: Collect daily market history
        run: python scripts/collect-market-history.py

      - name: Publish archive to dedicated data branch
        run: |
          set -euo pipefail
          mkdir -p /tmp/plutus-market-history
          cp market-history/daily.json /tmp/plutus-market-history/daily.json

          if git ls-remote --exit-code --heads origin market-history >/dev/null 2>&1; then
            git fetch origin market-history
            git checkout -B market-history FETCH_HEAD
          else
            git checkout --orphan market-history
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p market-history
          cp /tmp/plutus-market-history/daily.json market-history/daily.json
          git add market-history/daily.json
          if git diff --cached --quiet; then
            echo "Dedicated archive branch is already current."
            exit 0
          fi

          git config user.name "sebaptcd"
          git config user.email "dev@sebastian.ghiveci.com"
          git commit -m "Refresh daily public market history" \
            -m "Technical overview: publish the CCXT-aggregated daily USD archive to the dedicated market-history branch, keeping generated data out of dev/main application history and avoiding merge conflicts." \
            -m "Commit made with GPT-6"

          # If another writer moves the data branch, rebase the archive
          # commit onto its latest head and retry instead of losing the run.
          for attempt in 1 2 3; do
            if git push origin HEAD:market-history; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Archive push failed after three attempts." >&2
              exit 1
            fi
            git fetch origin market-history
            git rebase FETCH_HEAD
          done
