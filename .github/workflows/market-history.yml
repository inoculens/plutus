name: Refresh public market history

on:
  schedule:
    - cron: "25 4 * * *"
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - "app.js"
      - "scripts/collect-market-history.py"
      - "tests/test_market_history_collector.py"
      - ".github/workflows/market-history.yml"

permissions:
  contents: write

concurrency:
  group: plutus-market-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the branch being refreshed
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CCXT
        run: python -m pip install --disable-pip-version-check "ccxt>=4.4,<5"

      - name: Verify collector and application syntax
        run: |
          python -m py_compile scripts/collect-market-history.py
          python -m unittest discover -s tests -p 'test_market_history_collector.py'
          node --check app.js

      - name: Collect daily market history
        run: python scripts/collect-market-history.py

      - name: Commit and push archive when changed
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "sebaptcd"
          git config user.email "dev@sebastian.ghiveci.com"
          if git diff --quiet -- market-history/daily.json; then
            echo "Market history is already current."
            exit 0
          fi
          git add market-history/daily.json
          git commit -m "Refresh daily public market history" \
            -m "Technical overview: regenerate the static USD daily-close archive from public spot OHLCV markets through CCXT. The browser can consume the same-origin archive without contacting CoinGecko or third-party CORS proxies." \
            -m "Commit made with GPT-6"
          git push origin "HEAD:${BRANCH}"
