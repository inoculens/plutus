  <script>
  (function () {
    var GA = 'G-0JEDV505S7', KEY = 'inoculens.consent.v1';
    function read() {
      try {
        var r = localStorage.getItem(KEY);
        if (!r) return null;
        var v = JSON.parse(r);
        return (v && (v.choice === 'accepted' || v.choice === 'declined')) ? v.choice : null;
      } catch (e) { return null; }
    }
    function stub() {
      window.dataLayer = window.dataLayer || [];
      if (typeof window.gtag !== 'function') { window.gtag = function () { window.dataLayer.push(arguments); }; }
    }
    function load() {
      if (window.__gaLoaded) return;
      stub();
      window.gtag('js', new Date());
      window.gtag('config', GA, { anonymize_ip: true });
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA;
      document.head.appendChild(s);
      window.__gaLoaded = true;
    }
    function apply(c) {
      try { localStorage.setItem(KEY, JSON.stringify({ choice: c, at: new Date().toISOString() })); } catch (e) { /* ignore */ }
      stub();
      try { window.gtag('consent', 'update', { analytics_storage: c === 'accepted' ? 'granted' : 'denied', ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied' }); } catch (e) { /* ignore */ }
      if (c === 'accepted') load();
      var b = document.getElementById('cookie-banner');
      if (b) b.hidden = true;
    }
    var banner = document.getElementById('cookie-banner');
    var cur = read();
    if (cur === 'accepted') { if (banner) banner.hidden = true; load(); }
    else if (cur === 'declined') { if (banner) banner.hidden = true; }
    else if (banner) { banner.hidden = false; }
    var a = document.getElementById('cookie-accept');
    if (a) a.addEventListener('click', function () { apply('accepted'); });
    var d = document.getElementById('cookie-decline');
    if (d) d.addEventListener('click', function () { apply('declined'); });
  })();
