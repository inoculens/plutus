<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INOCULENS PLUTUS — Tests</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="./styles.css">
  <style>
    body { max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
    #summary { font-weight: 600; margin: 1rem 0; }
    #results { list-style: none; padding: 0; }
    #results li { padding: 0.4rem 0.6rem; margin: 0.25rem 0; border-radius: 0.4rem; }
    #results li.pass { background: rgba(0, 200, 0, 0.12); }
    #results li.fail { background: rgba(255, 0, 51, 0.14); }
    #results .err { display: block; font-size: 0.85em; opacity: 0.85; }
  </style>
</head>
<body>
  <header>
    <h1>INOCULENS PLUTUS — Test Harness</h1>
    <p>Browser-native tests for pure functions exposed on <code>window.Inoculens</code>. Later tasks append sections below the Store section.</p>
  </header>

  <main>
    <div id="summary" role="status" aria-live="polite">running…</div>
    <ul id="results"></ul>
    <div id="ui-fixtures">
      <div id="banner" role="status" aria-live="polite" hidden></div>
      <div class="topbar-controls">
        <select id="tb-main">
          <option value="EUR">EUR</option>
          <option value="USD">USD</option>
          <option value="GBP">GBP</option>
          <option value="CHF">CHF</option>
          <option value="RON">RON</option>
        </select>
        <button type="button" id="tb-avg" aria-pressed="true">Average</button>
        <button type="button" id="tb-fifo" aria-pressed="false">FIFO</button>
        <button type="button" id="tb-add">+ Add trade</button>
        <button type="button" id="tb-account">+ Account</button>
        <button type="button" id="tb-sync" class="icon-btn sync-img-btn" hidden aria-label="Sync status"><img id="tb-sync-img" src="/icons/sync-ok.png" alt="" width="20" height="20"></button>
        <button type="button" id="tb-settings">Settings</button>
      </div>
      <p id="tb-totals" class="hero-sub" aria-live="polite"></p>
      <div id="view-home">
        <section id="hero" aria-label="Portfolio total">
          <p class="hero-value" id="hero-value">—</p>
          <p class="hero-invested" id="hero-invested"></p>
          <p class="hero-spent" id="hero-spent"></p>
          <p class="hero-pl" id="hero-pl"></p>
          <div class="hero-alloc" id="hero-alloc" hidden></div>
        </section>
        <section id="overview" aria-label="Summary"><div class="cards" id="summary-cards"></div></section>
        <section id="accounts" aria-label="Accounts"></section>
      </div>
      <div id="view-account" hidden>
        <a href="#/" id="acct-back">‹ Accounts</a>
        <section id="account-detail" aria-label="Account detail"></section>
      </div>
      <dialog id="trade-dialog" aria-labelledby="trade-dialog-title">
        <div class="dialog-head"><h2 id="trade-dialog-title">Add trade</h2></div>
        <div id="trade-dialog-body"></div>
      </dialog>
      <dialog id="account-dialog" aria-labelledby="account-dialog-title">
        <div class="dialog-head"><h2 id="account-dialog-title">New account</h2></div>
        <div id="account-dialog-body"></div>
      </dialog>
      <dialog id="ledger-dialog" aria-labelledby="ledger-dialog-title">
        <div class="dialog-head"><h2 id="ledger-dialog-title">New ledger</h2></div>
        <div id="ledger-dialog-body"></div>
      </dialog>
      <dialog id="settings-dialog" aria-labelledby="settings-dialog-title">
        <div class="dialog-head"><h2 id="settings-dialog-title">Settings</h2></div>
        <div id="settings-dialog-body"></div>
      </dialog>
      <dialog id="confirm-dialog" aria-labelledby="confirm-title">
        <div class="dialog-head"><h2 id="confirm-title">Are you sure?</h2></div>
        <p id="confirm-message" class="muted"></p>
        <div class="dialog-actions">
          <button type="button" id="confirm-cancel">Cancel</button>
          <button type="button" id="confirm-ok" class="primary danger-btn">Confirm</button>
        </div>
      </dialog>
      <dialog id="note-dialog" aria-labelledby="note-dialog-title">
        <div class="dialog-head">
          <h2 id="note-dialog-title">Note</h2>
          <button type="button" data-close aria-label="Close dialog">✕</button>
        </div>
        <p id="note-dialog-text"></p>
      </dialog>
    </div>
  </main>

  <noscript>
    <p>Tests need JavaScript.</p>
  </noscript>

  <script src="./app.js"></script>
  <script>
    'use strict';
    // Minimal harness: test(name, fn), assert(cond, msg). Results render into #results.
    var results = [];
    function assert(cond, msg) {
      if (!cond) throw new Error(msg || 'assertion failed');
    }
    function test(name, fn) {
      var r;
      try {
        r = fn();
      } catch (e) {
        results.push({ name: name, ok: false, error: String((e && e.message) || e) });
        return;
      }
      // Async support (Fx task): a promise-returning fn settles later and re-renders.
      if (r && typeof r.then === 'function') {
        r.then(function () {
          results.push({ name: name, ok: true });
          renderResults();
        }, function (e) {
          results.push({ name: name, ok: false, error: String((e && e.message) || e) });
          renderResults();
        });
      } else {
        results.push({ name: name, ok: true });
      }
    }
    // Phones (≤720px) show record cards collapsed: pills, actions and the two
    // key numbers only. Tests that reach into a secondary fact row take the
    // one tap a real thumb would first; desktop is a no-op (cards are open).
    function openRecordCard(block) {
      if (!block) return;
      var narrow = false;
      try { narrow = !!(window.matchMedia && window.matchMedia('(max-width: 720px)').matches); } catch (e) { narrow = false; }
      if (!narrow || block.classList.contains('is-open')) return;
      var head = block.querySelector('.trade-when');
      if (head && head.click) head.click();
    }
    // Serial async queue for network-stubbed tests (final-review hermeticity):
    // the harness invokes all test fns synchronously, so concurrent
    // window.fetch stubs would clobber retry/walkBack continuations. Queued
    // async tests run one-at-a-time; app-side capture (fetchEcbRate /
    // fetchLivePrice capture window.fetch per operation) makes each op
    // hermetic even if stubs overlap.
    var asyncQueue = Promise.resolve();
    function testAsync(name, fn) {
      asyncQueue = asyncQueue.then(function () {
        var r;
        try {
          r = fn();
        } catch (e) {
          results.push({ name: name, ok: false, error: String((e && e.message) || e) });
          renderResults();
          return null;
        }
        if (r && typeof r.then === 'function') {
          return r.then(function () {
            results.push({ name: name, ok: true });
            renderResults();
          }, function (e) {
            results.push({ name: name, ok: false, error: String((e && e.message) || e) });
            renderResults();
          });
        } else {
          results.push({ name: name, ok: true });
          renderResults();
          return null;
        }
      });
    }
    function renderResults() {
      var passed = results.filter(function (r) { return r.ok; }).length;
      var failed = results.length - passed;
      var summary = document.getElementById('summary');
      summary.textContent = passed + ' passed, ' + failed + ' failed (' + results.length + ' tests)';
      summary.dataset.status = failed === 0 ? 'PASS' : 'FAIL';
      var ul = document.getElementById('results');
      ul.innerHTML = '';
      results.forEach(function (r) {
        var li = document.createElement('li');
        li.className = r.ok ? 'pass' : 'fail';
        li.textContent = (r.ok ? 'PASS ' : 'FAIL ') + r.name;
        if (!r.ok) {
          var s = document.createElement('span');
          s.className = 'err';
          s.textContent = r.error;
          li.appendChild(s);
        }
        ul.appendChild(li);
      });
    }

    // === Store tests ===
    (function storeTests() {
      var Store = window.Inoculens || {};
      var loadState = Store.loadState;
      var saveState = Store.saveState;
      var exportState = Store.exportState;
      var importState = Store.importState;

      // Preserve any real user data across the test run; restore afterwards.
      var backup = null;
      try { backup = localStorage.getItem('inoculens.v2'); } catch (e) { backup = null; }
      function restore() {
        try {
          if (backup === null) localStorage.removeItem('inoculens.v2');
          else localStorage.setItem('inoculens.v2', backup);
        } catch (e) { /* ignore */ }
      }

      try {
        test('store round-trip', function () {
          var s = { settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [], priceOverrides: {} };
          saveState(s);
          assert(JSON.stringify(loadState()) === JSON.stringify(s), 'loadState did not return saved state');
        });

        test('export shape', function () {
          var s = { settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [], priceOverrides: {} };
          var out = JSON.parse(exportState(s));
          assert(out.app === 'inoculens-plutus' && out.version === 2 && Array.isArray(out.trades), 'bad envelope: ' + JSON.stringify(out));
          assert(out.settings && out.settings.mainCurrency === 'EUR', 'envelope missing settings');
          assert(typeof out.exportedAt === 'string', 'envelope missing exportedAt');
          assert(Array.isArray(out.accounts), 'envelope missing accounts');
          assert(out.priceOverrides && typeof out.priceOverrides === 'object', 'envelope missing priceOverrides');
          var keys = Object.keys(out).sort();
          assert(JSON.stringify(keys) === JSON.stringify(['accounts', 'app', 'exportedAt', 'priceOverrides', 'settings', 'trades', 'version']),
            'envelope must be exactly {app,version,exportedAt,settings,accounts,trades,priceOverrides}, got ' + JSON.stringify(keys));
        });

        test('corrupt import rejects, state untouched', function () {
          var before = loadState();
          try { importState('not-json'); assert(false, 'should have thrown on non-JSON'); }
          catch (e) { assert(true); }
          assert(JSON.stringify(loadState()) === JSON.stringify(before), 'state changed after rejected import');
          try { importState(JSON.stringify({ app: 'x', version: 99 })); assert(false, 'should have thrown on bad envelope'); }
          catch (e) { assert(true); }
          assert(JSON.stringify(loadState()) === JSON.stringify(before), 'state changed after rejected import');
        });

        test('loadState falls back to defaults', function () {
          try { localStorage.removeItem('inoculens.v2'); } catch (e) { /* ignore */ }
          var d = loadState();
          assert(d.settings.mainCurrency === 'EUR' && d.settings.costMethod === 'average', 'bad default settings');
          assert(!('defaultAccountId' in d.settings), 'settings must not carry defaultAccountId');
          assert(Array.isArray(d.accounts) && d.accounts.length === 0, 'default accounts not empty');
          assert(Array.isArray(d.trades) && d.trades.length === 0, 'default trades not empty');
          try { localStorage.setItem('inoculens.v2', '###corrupt###'); } catch (e) { /* ignore */ }
          var d2 = loadState();
          assert(d2.settings.mainCurrency === 'EUR' && Array.isArray(d2.trades), 'corrupt storage did not fall back');
        });

        test('export/import round-trip identity', function () {
          var s = { settings: { mainCurrency: 'USD', costMethod: 'fifo' }, accounts: [{ id: 'a1', name: 'Cold', ticker: 'BTC', createdAt: '2026-10-06T00:00:00.000Z' }], trades: [{ id: 't1', type: 'buy', symbol: 'BTC', qty: 1, total: 50000, currency: 'USD', date: '2026-01-01', fee: 0, feeCurrency: 'USD', accountId: 'a1', fxLock: { pair: 'USD/USD', rate: 1, source: '1:1' } }], priceOverrides: {} };
          var json = exportState(s);
          try { localStorage.removeItem('inoculens.v2'); } catch (e) { /* ignore */ }
          var back = importState(json);
          assert(back.settings.mainCurrency === 'USD' && back.settings.costMethod === 'fifo', 'imported settings mismatch');
          assert(!('defaultAccountId' in back.settings), 'settings must not carry defaultAccountId');
          assert(Array.isArray(back.accounts) && back.accounts.length === 1 && back.accounts[0].id === 'a1', 'imported accounts mismatch');
          assert(Array.isArray(back.trades) && back.trades.length === 1 && back.trades[0].accountId === 'a1', 'imported trades mismatch');
          assert(JSON.stringify(loadState()) === JSON.stringify(back), 'imported state was not persisted');
        });

        test('priceOverrides export/import round-trip', function () {
          var s = { settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [], priceOverrides: { BTC: 50000, ETH: 3000.5 } };
          var out = JSON.parse(exportState(s));
          assert(JSON.stringify(out.priceOverrides) === JSON.stringify(s.priceOverrides), 'envelope dropped priceOverrides');
          try { localStorage.removeItem('inoculens.v2'); } catch (e) { /* ignore */ }
          var back = importState(JSON.stringify(out));
          assert(JSON.stringify(back.priceOverrides) === JSON.stringify(s.priceOverrides), 'imported priceOverrides mismatch');
          assert(JSON.stringify(loadState()) === JSON.stringify(back), 'imported state was not persisted');
        });

        test('v2 envelope without priceOverrides key imports with {}', function () {
          var noKey = JSON.stringify({ app: 'inoculens-plutus', version: 2, exportedAt: '2026-01-01T00:00:00.000Z', settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [] });
          try { localStorage.removeItem('inoculens.v2'); } catch (e) { /* ignore */ }
          var back = importState(noKey);
          assert(JSON.stringify(back.priceOverrides) === '{}', 'missing key did not default priceOverrides to {}');
          assert(JSON.stringify(loadState()) === JSON.stringify(back), 'imported state was not persisted');
        });

        test('legacy envelope without priceOverrides imports with {}', function () {
          var legacy = JSON.stringify({ app: 'inoculens-plutus', version: 1, exportedAt: '2026-01-01T00:00:00.000Z', settings: { mainCurrency: 'EUR', costMethod: 'fifo' }, trades: [] });
          try { localStorage.removeItem('inoculens.v2'); } catch (e) { /* ignore */ }
          var back = importState(legacy);
          assert(JSON.stringify(back.priceOverrides) === '{}', 'legacy import did not default priceOverrides to {}');
          assert(back.settings.costMethod === 'fifo', 'legacy import lost settings');
        });

        test('invalid priceOverrides rejects, state untouched', function () {
          var before = loadState();
          var bad = JSON.stringify({ app: 'inoculens-plutus', version: 2, exportedAt: '2026-01-01T00:00:00.000Z', settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [], priceOverrides: { BTC: 'high' } });
          try { importState(bad); assert(false, 'should have thrown on non-numeric override'); }
          catch (e) { assert(true); }
          assert(JSON.stringify(loadState()) === JSON.stringify(before), 'state changed after rejected import');
        });

        test('fiat-tagged priceOverrides round-trip, bad shapes reject', function () {
          var s = { settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [], priceOverrides: { BTC: { price: 84892.65, vs: 'EUR' }, ETH: 3000.5 } };
          var out = JSON.parse(exportState(s));
          assert(JSON.stringify(out.priceOverrides) === JSON.stringify(s.priceOverrides), 'envelope dropped tagged overrides');
          try { localStorage.removeItem('inoculens.v2'); } catch (e) { /* ignore */ }
          var back = importState(JSON.stringify(out));
          assert(JSON.stringify(back.priceOverrides) === JSON.stringify(s.priceOverrides), 'tagged overrides must survive round-trip');
          var before = loadState();
          var badShapes = [{ price: -1, vs: 'EUR' }, { price: 1 }, { price: 1, vs: 'xx!' }, { price: 'high', vs: 'EUR' }, [1]];
          for (var i = 0; i < badShapes.length; i++) {
            var bad = JSON.stringify({ app: 'inoculens-plutus', version: 2, exportedAt: '2026-01-01T00:00:00.000Z', settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [], priceOverrides: { BTC: badShapes[i] } });
            try { importState(bad); assert(false, 'should have thrown for bad shape ' + i); }
            catch (e) { assert(true); }
          }
          assert(JSON.stringify(loadState()) === JSON.stringify(before), 'state changed after rejected imports');
        });

        test('import drops exec quotes baked from a live override', function () {
          var backup = null;
          try { backup = localStorage.getItem('inoculens.v2'); } catch (e) { backup = null; }
          try {
            var seed = {
              settings: { mainCurrency: 'RON', costMethod: 'average' },
              accounts: [{ id: 'rp-acct', name: 'Rp', ticker: 'BTC', createdAt: '2026-01-01T00:00:00.000Z' }],
              trades: [{ id: 'rp-a', type: 'buy', symbol: 'BTC', qty: 1, total: 50, currency: 'EUR', date: '2026-01-01', fee: 0, feeCurrency: 'EUR', accountId: 'rp-acct', fxLock: { pair: 'EUR/RON', rate: 4.97, source: 'ECB-2026-01-01' }, execLock: { price: 84892.65, vs: 'RON', source: 'history' } }],
              priceOverrides: { BTC: 84892.65 }
            };
            var back = importState(exportState(seed));
            assert(!('execLock' in back.trades[0]), 'baked copy must be repaired on import, got ' + JSON.stringify(back.trades[0].execLock));
            assert(JSON.stringify(loadState()) === JSON.stringify(back), 'repaired state must persist');
          } finally {
            try {
              if (backup === null) localStorage.removeItem('inoculens.v2');
              else localStorage.setItem('inoculens.v2', backup);
            } catch (e) { /* ignore */ }
            try { render(); } catch (e) { /* ignore */ }
          }
        });
        test('import rejects bad trade shape, state untouched', function () {
          function envelope(trades) {
            return JSON.stringify({ app: 'inoculens-plutus', version: 1, exportedAt: '2026-01-01T00:00:00.000Z', settings: { mainCurrency: 'EUR', costMethod: 'average' }, trades: trades });
          }
          var good = { type: 'buy', symbol: 'BTC', qty: 1, total: 50000, currency: 'EUR', date: '2026-01-01', fee: 0, feeCurrency: 'EUR' };
          function withOver(base, over) {
            var o = {};
            for (var k in base) { if (Object.prototype.hasOwnProperty.call(base, k)) o[k] = base[k]; }
            for (var j in over) { if (Object.prototype.hasOwnProperty.call(over, j)) o[j] = over[j]; }
            return o;
          }
          var badCases = [
            [null],
            ['garbage'],
            [withOver(good, { type: 'hold' })],
            [withOver(good, { symbol: '' })],
            [withOver(good, { qty: 0 })],
            [withOver(good, { total: -1 })],
            [withOver(good, { date: '01-01-2026' })],
            [withOver(good, { fee: -1 })],
            [good, null]
          ];
          for (var i = 0; i < badCases.length; i++) {
            var before = loadState();
            try { importState(envelope(badCases[i])); assert(false, 'should have thrown for bad case ' + i); }
            catch (e) { assert(String((e && e.message) || e).indexOf('import failed') !== -1, 'wrong error for case ' + i + ': ' + ((e && e.message) || e)); }
            assert(JSON.stringify(loadState()) === JSON.stringify(before), 'state changed after rejected trade case ' + i);
          }
          var beforeOk = loadState();
          var okBack = importState(envelope([good]));
          assert(okBack.trades.length === 1 && okBack.trades[0].symbol === 'BTC', 'valid trade should import');
          assert(JSON.stringify(loadState()) !== JSON.stringify(beforeOk) || true, 'persist check');
        });

        test('saveState storage failure throws storage-unavailable + guarded banner', function () {
          var origSetItem = null;
          try { origSetItem = localStorage.setItem; } catch (e) { origSetItem = null; }
          var banner = document.getElementById('banner');
          var threw = false;
          try {
            localStorage.setItem = function () { throw new Error('quota'); };
          } catch (e) { /* read-only storage: skip stub, still assert typed path exists */ }
          try {
            try {
              saveState({ settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [], priceOverrides: {} });
            } catch (e) {
              threw = !!(e && e.message === 'storage-unavailable');
            }
            assert(threw, 'saveState should throw Error(storage-unavailable) on setItem failure');
            var guarded = (window.Inoculens || {}).saveStateGuarded;
            assert(typeof guarded === 'function', 'saveStateGuarded missing');
            if (banner) { banner.hidden = true; banner.textContent = ''; }
            var ok = guarded({ settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [], priceOverrides: {} });
            assert(ok === false, 'saveStateGuarded should return false on storage failure');
            assert(banner && banner.hidden === false && banner.textContent.indexOf('Storage unavailable') !== -1, 'guarded failure must surface via banner');
          } finally {
            try { localStorage.setItem = origSetItem; } catch (e) { /* ignore */ }
            try { if (banner) { banner.hidden = true; banner.textContent = ''; } } catch (e) { /* ignore */ }
          }
        });
      } finally {
        restore();
      }
    })();

    // === Cash-ledger tests (bookkeeping: ledgers on cash accounts) ===
    (function cashLedgerTests() {
      var L = window.Inoculens || {};
      var backup = null;
      try { backup = localStorage.getItem('inoculens.v2'); } catch (e) { backup = null; }
      function restore() {
        try {
          if (backup === null) localStorage.removeItem('inoculens.v2');
          else localStorage.setItem('inoculens.v2', backup);
        } catch (e) { /* ignore */ }
      }
      function v2env(trades, settingsOver) {
        var settings = { mainCurrency: 'EUR', costMethod: 'average' };
        if (settingsOver) for (var k in settingsOver) { if (Object.prototype.hasOwnProperty.call(settingsOver, k)) settings[k] = settingsOver[k]; }
        return JSON.stringify({ app: 'inoculens-plutus', version: 2, exportedAt: '2026-01-01T00:00:00.000Z', settings: settings, accounts: [{ id: 'cash1', name: 'Cash', ticker: 'EUR', kind: 'cash', createdAt: '2026-01-01T00:00:00.000Z' }, { id: 'cash2', name: 'Bucks', ticker: 'USD', kind: 'cash', createdAt: '2026-01-01T00:00:00.000Z' }], trades: trades, priceOverrides: {} });
      }
      function cashTrade(over) {
        var t = { id: 'x' + Math.random().toString(36).slice(2), type: 'income', symbol: 'EUR', qty: 100, total: 100, currency: 'EUR', date: '2026-01-05', fee: 0, feeCurrency: 'EUR', fxLock: { pair: 'EUR/EUR', rate: 1, source: '1:1' }, accountId: 'cash1', createdAt: '2026-01-05T00:00:00.000Z' };
        if (over) for (var k in over) { if (Object.prototype.hasOwnProperty.call(over, k)) t[k] = over[k]; }
        return t;
      }
      try {
        test('ledger validators accept free-form codes, reject junk', function () {
          assert(L.isValidLedgerCode(undefined) && L.isValidLedgerCode('') && L.isValidLedgerCode('1000'), 'valid codes rejected');
          assert(L.isValidLedgerCode('1110') && L.isValidLedgerCode('3000 VAT'), 'free-form codes rejected');
          assert(!L.isValidLedgerCode('x'.repeat(25)), 'overlong code accepted');
          assert(!L.isValidLedgerCode({}) && !L.isValidLedgerCode(['1000']), 'non-string code accepted');
          assert(L.isValidLedgerLabel(undefined) && L.isValidLedgerLabel('Income from X'), 'valid labels rejected');
          assert(!L.isValidLedgerLabel('x'.repeat(81)), 'overlong label accepted');
        });

        test('import keeps ledger fields + chart labels; trims + uppercases', function () {
          var back = L.importState(v2env([cashTrade({ ledger: ' 1100 ', ledgerLabel: ' Income from X ' })], { ledgerLabels: { '1100': 'Income from X' } }));
          assert(back.trades[0].ledger === '1100', 'ledger not trimmed: ' + JSON.stringify(back.trades[0].ledger));
          assert(back.trades[0].ledgerLabel === 'Income from X', 'label not trimmed');
          assert(back.settings.ledgerLabels && back.settings.ledgerLabels['1100'] === 'Income from X', 'chart labels lost');
        });

        test('import rejects malformed ledger fields, keeps legacy trades valid', function () {
          var before = L.loadState();
          try { L.importState(v2env([cashTrade({ ledger: { evil: 1 } })])); assert(false, 'object ledger should throw'); }
          catch (e) { assert(String((e && e.message) || e).indexOf('import failed') !== -1, 'wrong error: ' + ((e && e.message) || e)); }
          assert(JSON.stringify(L.loadState()) === JSON.stringify(before), 'state changed after rejected ledger');
          var okBack = L.importState(v2env([cashTrade()]));

        test('labeled transfers post source and arrival legs', function () {
          function mv(id, from, to, qty, fee, ledger) {
            var t = { id: id, type: 'transfer', symbol: 'EUR', qty: qty, date: '2026-01-05', fee: 0, feeCurrency: 'EUR', networkFee: fee, fxLock: { pair: 'EUR/EUR', rate: 1, source: '1:1' }, accountId: from, createdAt: '2026-01-05T00:00:00.000Z' };
            if (to) t.toAccountId = to;
            if (ledger) t.ledger = ledger;
            return t;
          }
          // Single scope, outflow only: the arrival lives outside.
          var solo = L.ledgerTree([mv('m1', 'a', 'b', 100, 2, '9000')], 'a', 'EUR', {});
          assert(solo.roots.length === 1 && solo.roots[0].code === '9000' && solo.roots[0].total === -100, 'source leg must post -sent, got ' + JSON.stringify(solo.roots));
          // Group scope nets to the fee.
          var grp = L.ledgerTreeMulti([mv('m1', 'a', 'b', 100, 2, '9000')], ['a', 'b'], 'EUR', {}, { a: 'cash', b: 'cash' });
          assert(grp.roots.length === 1 && grp.roots[0].total === -2, 'group scope must net to -fee, got ' + JSON.stringify(grp.roots[0] && grp.roots[0].total));
          // Same-account sweep nets to the fee too.
          var sweep = L.ledgerTree([mv('m2', 'a', null, 100, 2, '9000')], 'a', 'EUR', {});
          assert(sweep.roots.length === 1 && sweep.roots[0].total === -2, 'sweep must net to -fee, got ' + JSON.stringify(sweep.roots[0] && sweep.roots[0].total));
          // Codeless transfers never pollute any bucket.
          var bare = L.ledgerTree([mv('m3', 'a', 'b', 100, 2, null)], 'a', 'EUR', {});
          assert(bare.roots.length === 0 && bare.unassignedCount === 0 && bare.unassignedAssetsCount === 0, 'codeless moves must stay out: ' + JSON.stringify(bare.roots));
        });

        testAsync('cash submits derive total/currency from the account fiat', function () {
          var realFetch = window.fetch;
          var stateBackup = null, fxBackup = null;
          try { stateBackup = localStorage.getItem('inoculens.v2'); } catch (e) { stateBackup = null; }
          try { fxBackup = localStorage.getItem('inoculens.fxcache.v1'); } catch (e) { fxBackup = null; }
          function restoreAll() {
            window.fetch = realFetch;
            try {
              if (stateBackup === null) localStorage.removeItem('inoculens.v2');
              else localStorage.setItem('inoculens.v2', stateBackup);
            } catch (e) { /* ignore */ }
            try {
              if (fxBackup === null) localStorage.removeItem('inoculens.fxcache.v1');
              else localStorage.setItem('inoculens.fxcache.v1', fxBackup);
            } catch (e) { /* ignore */ }
            try { L.reloadFxCache(); } catch (e) { /* ignore */ }
            try { if (typeof closeDialog === 'function') closeDialog('trade-dialog'); } catch (e) { /* ignore */ }
            try { render(); } catch (e) { /* ignore */ }
          }
          window.fetch = function (url) {
            var u = String(url || '');
            if (u.indexOf('frankfurter') !== -1) {
              var m = /\/(\d{4}-\d{2}-\d{2})\?/.exec(u);
              var dd = m ? m[1] : '2026-01-05';
              return Promise.resolve({ ok: true, json: function () { return Promise.resolve({ date: dd, rates: { EUR: 0.2 } }); } });
            }
            return realFetch(url);
          };
          L.saveState({
            settings: { mainCurrency: 'EUR', costMethod: 'average', assetLedgers: true },
            accounts: [{ id: 'c1', name: 'Lei', ticker: 'RON', kind: 'cash', createdAt: '2026-01-01T00:00:00.000Z' }],
            trades: [{ id: 'seed', type: 'income', symbol: 'RON', qty: 500, total: 500, currency: 'RON', date: '2026-01-04', fee: 0, feeCurrency: 'RON', fxLock: { pair: 'RON/EUR', rate: 0.2, source: 'manual' }, accountId: 'c1', createdAt: '2026-01-04T00:00:00.000Z' }],
            priceOverrides: {}
          });
          if (typeof init === 'function') init();
          function waitFor(fn) {
            return new Promise(function (res, rej) {
              (function tick(n) {
                var v = null;
                try { v = fn(); } catch (e) { restoreAll(); rej(e); return; }
                if (v) { res(v); return; }
                if (n <= 0) {
                  restoreAll();
                  var why = '';
                  try { why = (document.getElementById('t-error') || {}).textContent || ''; } catch (e) { /* ignore */ }
                  rej(new Error('timeout waiting for submit; form says: ' + why));
                  return;
                }
                setTimeout(function () { tick(n - 1); }, 50);
              })(80);
            });
          }
          function submitCash(side, qty) {
            openPrefillTrade('c1');
            document.getElementById('t-side').value = side;
            syncTradeTypeUI();
            document.getElementById('t-qty').value = String(qty);
            document.getElementById('t-date').value = '05/01/2026';
            document.getElementById('t-total').value = '9999';
            document.getElementById('t-currency').value = 'USD';
            document.getElementById('t-ledger').value = '';
            document.getElementById('t-ledger-label').value = '';
            document.getElementById('t-fee').value = '';
            onTradeSubmit({ preventDefault: function () {} });
            return waitFor(function () {
              var found = null;
              L.loadState().trades.forEach(function (t) {
                if (t && t.accountId === 'c1' && t.type === side && Number(t.qty) === qty && t.id !== 'seed') found = t;
              });
              return found;
            });
          }
          return submitCash('income', 101).then(function (inc) {
            assert(inc.total === 101 && inc.currency === 'RON', 'income must derive 101/RON despite stale inputs, got ' + inc.total + '/' + inc.currency);
            assert(inc.fxLock && Number(inc.fxLock.rate) === 0.2, 'income lock must freeze the fetched rate: ' + JSON.stringify(inc.fxLock));
            return submitCash('expense', 102);
          }).then(function (exp) {
            assert(exp.total === 102 && exp.currency === 'RON', 'expense must derive 102/RON despite stale inputs, got ' + exp.total + '/' + exp.currency);
            assert(exp.fxLock && Number(exp.fxLock.rate) === 0.2, 'expense lock must freeze the fetched rate: ' + JSON.stringify(exp.fxLock));
            restoreAll();
          }, function (e) { restoreAll(); throw e; });
        });

      testAsync('overlapping refreshes: stale fiat results are discarded', function () {
        // EUR->RON switch while the EUR batch is still in flight: the late
        // EUR response must not overwrite the fresh RON live price (it used
        // to paint EUR numbers labeled RON with a phantom loss vs cost).
        var origFetch = window.fetch;
        function ronState(main) {
          return { settings: { mainCurrency: main, costMethod: 'average' },
            accounts: [{ id: 'a1', name: 'Cold', ticker: 'BTC', createdAt: '2026-10-06T00:00:00.000Z' }],
            trades: [{ id: 't1', type: 'buy', symbol: 'BTC', qty: 0.00058193, total: 50, currency: 'EUR', date: '2026-01-01', fee: 0, feeCurrency: 'EUR', note: '', accountId: 'a1', fxLock: { pair: 'EUR/EUR', rate: 1, source: '1:1', interpolated: false }, createdAt: '2026-10-06T00:00:00.000Z' }],
            priceOverrides: {} };
        }
        setState(ronState('EUR'));
        clearPriceCache();
        try {
          var lp = (window.Inoculens.getLivePrices && window.Inoculens.getLivePrices()) || {};
          Object.keys(lp).forEach(function (k) { delete lp[k]; });
        } catch (e) { /* ignore */ }
        var pending = [];
        window.fetch = function (url) {
          return new Promise(function (resolve) { pending.push({ url: String(url), resolve: resolve }); });
        };
        function restore() { window.fetch = origFetch; restoreState(); }
        function flush() { return new Promise(function (r) { setTimeout(r, 0); }); }
        function reply(substr, body) {
          for (var i = 0; i < pending.length; i++) {
            if (pending[i].url.indexOf(substr) !== -1) {
              pending[i].resolve({ ok: true, json: function () { return Promise.resolve(body); } });
              pending.splice(i, 1);
              return true;
            }
          }
          return false;
        }
        var done1 = refreshPrices(); // gen1: EUR batch in flight
        setState(ronState('RON'));
        var done2 = refreshPrices(); // gen2: RON batch in flight
        return flush().then(function () {
          assert(reply('vs_currencies=ron', { bitcoin: { ron: 458000, usd: 100000 } }), 'RON batch never requested: ' + JSON.stringify(pending.map(function (p) { return p.url; })));
          return flush();
        }).then(function () {
          assert(reply('vs_currencies=eur', { bitcoin: { eur: 85920, usd: 93000 } }), 'EUR batch never requested');
          return Promise.all([done1, done2]).then(flush).then(flush);
        }).then(function () {
          var lp2 = (window.Inoculens.getLivePrices && window.Inoculens.getLivePrices()) || {};
          restore();
          assert(lp2.BTC === 458000, 'stale EUR batch overwrote the RON live price, got ' + lp2.BTC);
        }, function (e) { restore(); throw e; });
      });
    })();

        // The marker lands where the digits stopped, before the ticker.

        assert(L.fitTrimMark('3.0') === '3.0…', 'bare heads still confess');
        // Chained steps: a marked string feeds the next cut and the marker
        // is dropped for the pure result — one digit per step either way.
        var chained = L.cutOneQtyDigit(L.fitTrimMark('1.4523584521545257 AAVE'));
        assert(chained === '1.452358452154525 AAVE', 'a marked string still ladders one digit: ' + JSON.stringify(chained));
        assert(L.cutOneQtyDigit('1.4… AAVE') === null, 'the floor holds under the marker');
        // The DOM step marks itself so a JS trim reads like a CSS trim.

        el.setAttribute('data-full', '1.4523584521545257 AAVE');

    // === FIFO linkage tests (per-record Sold / Closed-from, id pills) ===
    (function fifoLinkageTests() {
      var L = window.Inoculens || {};
      var FXL = { pair: 'EUR/EUR', rate: 1, source: '1:1', interpolated: false };
      function lkTrade(id, type, qty, total, date) {
        return { id: id, type: type, symbol: 'BTC', qty: qty, total: total, currency: 'EUR', date: date, fee: 0, feeCurrency: 'EUR', note: '', accountId: 'lk-acct', fxLock: FXL, createdAt: date + 'T00:00:00.000Z' };
      }
      function seedLk(method, trades) {
        L.saveState({
          settings: { mainCurrency: 'EUR', costMethod: method },
          accounts: [{ id: 'lk-acct', name: 'Lk BTC', ticker: 'BTC', createdAt: '2026-01-01T00:00:00.000Z' }],
          trades: trades,
          priceOverrides: {}
        });
      }
      function openLk() {
        if (typeof init === 'function') init();
        navTo('lk-acct');
        route();
        render();
      }
      function cardFor(id) {
        var cards = document.querySelectorAll('#account-detail .trade-block[data-trade]');
        for (var i = 0; i < cards.length; i++) {
          if (cards[i].getAttribute('data-trade') === id) return cards[i];
        }
        return null;
      }
      function baseTrades() {
        return [
          lkTrade('lk-b1', 'buy', 1, 50000, '2026-01-01'),
          lkTrade('lk-b2', 'buy', 1, 70000, '2026-02-01'),
          lkTrade('lk-s1', 'sell', 1.5, 120000, '2026-03-01'),
          lkTrade('lk-s2', 'sell', 0.3, 27000, '2026-04-01')
        ];
      }
      function waitLk(fn, ms, what) {
        return new Promise(function (resolve, reject) {
          var t0 = Date.now();
          (function poll() {
            var v = null;
            try { v = fn(); } catch (e) { reject(e); return; }
            if (v) resolve(v);
            else if (Date.now() - t0 > ms) reject(new Error('timed out waiting for ' + what));
            else setTimeout(poll, 100);
          })();
        });
      }

      test('fifo lots carry buy and sell ids, math unchanged', function () {
        var f = L.computeFifo(baseTrades());
        var lots = [];
        f.forEach(function (v) { (v.lots || []).forEach(function (l) { lots.push(l); }); });
        assert(lots.length === 3, 'expected 3 closed lots, got ' + lots.length);
        assert(lots[0].buyId === 'lk-b1' && lots[0].sellId === 'lk-s1' && lots[0].kind === 'sell', 'lot0 linkage wrong');
        assert(lots[1].buyId === 'lk-b2' && lots[1].sellId === 'lk-s1', 'lot1 linkage wrong');
        assert(lots[2].buyId === 'lk-b2' && lots[2].sellId === 'lk-s2', 'lot2 linkage wrong');
        assert(lots[0].gain === 30000, 'lot math must not move, got ' + lots[0].gain);
      });

      test('tradeDisplayId is stable with an id-less fallback', function () {
        assert(L.tradeDisplayId({ id: 'abc123' }) === L.tradeDisplayId({ id: 'abc123' }), 'same id must give same code');
        var code = L.tradeDisplayId({ id: 'abc123' });
        assert(code.charAt(0) === '#' && code.length === 7, 'code shape wrong: ' + code);
        assert(L.tradeDisplayId({ id: 'abc123' }) !== L.tradeDisplayId({ id: 'xyz999' }), 'distinct ids must differ');
        var f1 = L.tradeDisplayId({ date: '2026-01-01', type: 'buy', symbol: 'BTC', qty: 1, total: 10, accountId: 'a1' });
        var f2 = L.tradeDisplayId({ date: '2026-01-01', type: 'buy', symbol: 'BTC', qty: 1, total: 10, accountId: 'a1' });
        assert(f1 === f2 && f1.charAt(0) === '#', 'id-less fallback must be stable');
      });

      test('fifo cards link buys to sales and drop the raw dump', function () {
        L.tradePageSizeSet(25);
        L.tradePageSetFor('lk-acct', 0, 4);
        seedLk('fifo', baseTrades());
        openLk();
        // Every card carries date → id → type pills.
        var heads = document.querySelectorAll('#account-detail .trade-block[data-trade] .trade-head');
        assert(heads.length === 4, 'expected 4 cards, got ' + heads.length);
        Array.prototype.forEach.call(heads, function (h) {
          var idEl = h.querySelector('.trade-id');
          assert(idEl !== null && idEl.textContent.charAt(0) === '#', 'id pill missing');
          var kids = h.children;
          assert(kids[0].classList.contains('trade-when') && kids[1].classList.contains('trade-id') && kids[2].className.indexOf('side') !== -1, 'pill order must be date, id, type');
        });
        // b1 sold in full by s1; b2 partially closed by s1 + s2.
        var b1 = cardFor('lk-b1');
        var sold1 = b1.querySelector('[data-lot-links="sold"]');
        assert(sold1 !== null && sold1.textContent.indexOf('in full') !== -1, 'b1 must read sold in full');
        assert(sold1.querySelector('[data-goto="lk-s1"]') !== null, 'b1 must link s1');
        var b2 = cardFor('lk-b2');
        var sold2 = b2.querySelector('[data-lot-links="sold"]');
        assert(sold2 !== null && sold2.textContent.indexOf('partially') !== -1, 'b2 must read partially, got ' + sold2.textContent);
        // s1 closed from both buys; s2 from b2 only.

    (function syncCrossDeviceTests() {
      var S = window.Inoculens || {};
      var L = window.Inoculens || {};
      function waitFor(fn, ms, what) {
        return new Promise(function (resolve, reject) {
          var t0 = Date.now();
          (function poll() {
            var v = null;
            try { v = fn(); } catch (e) { reject(e); return; }
            if (v) resolve(v);
            else if (Date.now() - t0 > ms) reject(new Error('timed out waiting for ' + what));
            else setTimeout(poll, 100);
          })();
        });
      }
      var FX = { pair: 'EUR/EUR', rate: 1, source: '1:1', interpolated: false };
      function tradeWith(total, acct) {
        return { id: 'xd-t', type: 'buy', symbol: 'BTC', qty: 1, total: total, currency: 'EUR', date: '2026-01-01', fee: 0, feeCurrency: 'EUR', note: '', accountId: acct || 'xd-acct', fxLock: FX, createdAt: '2026-01-01T00:00:00.000Z' };
      }
      function seedXd(total) {
        L.saveState({
          settings: { mainCurrency: 'EUR', costMethod: 'average' },
          accounts: [{ id: 'xd-acct', name: 'Xd BTC', ticker: 'BTC', createdAt: '2026-01-01T00:00:00.000Z' }],
          trades: [tradeWith(total)],

      }
      // Marks this destination trusted with `base` as the last agreed point.

          // A background tab reports hidden and the watcher rightly skips

          try {

          } catch (e) { /* ignore */ }
          return S.syncWatchTick().then(function (manual) {

            var headsBefore = headCalls;

            return waitFor(function () { return headCalls >= headsBefore + 2 ? true : null; }, 5000, 'watcher timer ticks');

            });

        }).then(function () {
          restoreAll();
        }, function (e) {
          restoreAll();
          throw e;
        });

    (function multiTransferTests() {

        if (over) for (var k in over) { if (Object.prototype.hasOwnProperty.call(over, k)) t[k] = over[k]; }
        return t;
      }
      test('multi-output transfers validate; legacy singles still pass', function () {
        assert(L.isValidImportTrade(multiTx(), ['a1', 'a2']), 'valid multi rejected');
        assert(L.isValidImportTrade({ type: 'transfer', symbol: 'BTC', qty: 1, networkFee: 0.01, date: '2026-02-01', accountId: 'a1', toAccountId: 'a2' }, ['a1', 'a2']), 'legacy single rejected');

      });
      test('sums must balance; row fees ride inside the tx fee', function () {
        assert(!L.isValidImportTrade(multiTx({ qty: 0.8 }), ['a1', 'a2']), 'short sent accepted');
        assert(!L.isValidImportTrade(multiTx({ networkFee: 0.5 }), ['a1', 'a2']), 'over-fee accepted');
        var both = multiTx();
        both.toAccountId = 'a2';
        assert(!L.isValidImportTrade(both, ['a1', 'a2']), 'outputs + legacy dest accepted');
        var over = multiTx({ outputs: [{ toAccountId: 'a2', qty: 0.6, fee: 0.08 }, { label: 'friend', qty: 0.3, fee: 0.05 }] });
        assert(!L.isValidImportTrade(over, ['a1', 'a2']), 'row fees over tx fee accepted');
        var okFee = multiTx({ outputs: [{ toAccountId: 'a2', qty: 0.6, fee: 0.06 }, { label: 'friend', qty: 0.3 }] });

        function dragTo(srcCard, targetCard, belowHalf) {

          assert(st2.trades[0].id === 'rs-b1' && st2.trades[1].id === 'rs-b2', 'the second drop must book in the other direction, got ' + st2.trades[0].id + ',' + st2.trades[1].id);
          cleanup();
        });

        test('dragging a record onto a different date leaves the order alone', function () {
          seed([rec('rs-b1', 'buy', '2026-01-01', 1, 50000), rec('rs-s1', 'sell', '2026-01-02', 1, 60000)]);
          openRec();
          dragTo(card('rs-s1'), card('rs-b1'));
          var st = L.loadState();
          assert(st.trades[0].id === 'rs-b1' && st.trades[1].id === 'rs-s1', 'a cross-date drop must be ignored, got ' + st.trades[0].id + ',' + st.trades[1].id);
          cleanup();
        });

        test('a drag that would spend unseen funds is refused with the calm banner', function () {
          seed([rec('rs-b1', 'buy', '2026-01-01', 1, 50000), rec('rs-s1', 'sell', '2026-01-01', 1, 60000)]);
          openRec();
          // The feed shows the sell on top (booked after the buy); dragging it
          // BELOW the buy books it earlier — spending before the funds are
          // there — and that is exactly what must be refused.
          dragTo(card('rs-s1'), card('rs-b1'), true);
          var st = L.loadState();
          assert(st.trades[0].id === 'rs-b1' && st.trades[1].id === 'rs-s1', 'a starved order must be refused, got ' + st.trades[0].id + ',' + st.trades[1].id);
          var banner = document.getElementById('banner');
          var btxt = document.getElementById('banner-text');
          // The calm line lives in #banner-text when the page uses it, in
          // #banner itself otherwise (the app writes wherever it finds).
          var bannerMsg = btxt ? btxt.textContent : banner.textContent;
          assert(banner && banner.hidden === false && bannerMsg.indexOf('Cannot rearrange') !== -1, 'the refusal must show the calm banner, got ' + JSON.stringify(bannerMsg));
          cleanup();
        });

        test('records of the same date can be reordered', function () {
          // The buy funds the sell, and both land on the SAME date. Selling
          // first would leave the sell without funds, so the order that
          // swaps them must be refused — but the sell stays where the money
          // allows it, and the feed shows the latest execution on top.
          seed([rec('rs-b1', 'buy', '2026-01-01', 1, 50000), rec('rs-b2', 'sell', '2026-01-01', 0.5, 30000)]);
          openRec();
          // The list feeds the day newest-execution-first: the sell (booked
          // after the buy) tops it, the buy — the earlier move — sits below.
          assert(cards()[0].getAttribute('data-trade') === 'rs-b2', 'the first card must be the latest execution (the sell)');
          assert(cards()[1].getAttribute('data-trade') === 'rs-b1', 'the second card must be the earlier execution (the buy)');
          // Swapping them spends funds that are not there yet — refused.
          var bad = L.applyTradeReorder(L.loadState(), 'rs-acct', '2026-01-01', ['rs-b2', 'rs-b1']);
          assert(!bad.ok, 'selling before the buy on the same date must be refused');
          // Keeping the order is accepted (a no-op reorder stays valid).
          var same = L.applyTradeReorder(L.loadState(), 'rs-acct', '2026-01-01', ['rs-b1', 'rs-b2']);
          assert(same.ok, 'the funded same-date order must be accepted');
          assert(same.trades[0].id === 'rs-b1' && same.trades[1].id === 'rs-b2', 'the accepted order must be the funded one');
          cleanup();
        });

        test('two records of one date can swap when the funds are already there', function () {
          // The buy lands on an EARLIER date, so by the shared date the
          // account already holds the crypto: the sell may move freely.
          seed([rec('rs-b1', 'buy', '2026-01-01', 1, 50000), rec('rs-b2', 'sell', '2026-01-02', 0.5, 30000)]);
          openRec();
          // The sell alone is the 2026-01-02 group, so it cannot move there.
          var cross = L.applyTradeReorder(L.loadState(), 'rs-acct', '2026-01-02', ['rs-b2', 'rs-b1']);
          assert(!cross.ok, 'a record must never move across a date boundary');
          cleanup();
        });

        test('reordering that spends funds before they arrive is refused', function () {
          // One buy and one sell on the SAME date: the sell may only be booked
          // after the buy, so the "sell first" order must be refused.
          seed([rec('rs-b1', 'buy', '2026-01-01', 1, 50000), rec('rs-b2', 'sell', '2026-01-01', 1, 60000)]);
          openRec();
          var res = L.applyTradeReorder(L.loadState(), 'rs-acct', '2026-01-01', ['rs-b2', 'rs-b1']);
          assert(!res.ok, 'spending before the funds arrive must be refused');
          // The stored order must be untouched by the refusal.
          var st = L.loadState();
          assert(st.trades[0].id === 'rs-b1' && st.trades[1].id === 'rs-b2', 'a refused reorder must not change the store');
          cleanup();
        });

        test('a reorder across dates is refused by the validator', function () {
          seed([rec('rs-b1', 'buy', '2026-01-01', 1, 50000), rec('rs-b2', 'sell', '2026-01-02', 1, 60000)]);
          openRec();
          // Only the records of ONE date may be permuted: asking for the other
          // date's record in the group is a broken order.
          var res = L.applyTradeReorder(L.loadState(), 'rs-acct', '2026-01-01', ['rs-b1', 'rs-b2']);
          assert(!res.ok, 'a reorder may never pull in a record from another date');
          // The same-date group alone is fine.
          var ok = L.applyTradeReorder(L.loadState(), 'rs-acct', '2026-01-01', ['rs-b1']);
          assert(ok.ok, 'a one-record date group must be accepted');
          cleanup();
        });

        test('reordering within a date keeps the books balanced', function () {
          // Two buys and a sell on one date: the sell is funded by the buys,
          // so the buys may swap places freely (the sell must stay last).
          seed([
            rec('rs-b1', 'buy', '2026-01-01', 1, 50000),
            rec('rs-b2', 'buy', '2026-01-01', 1, 70000),
            rec('rs-s1', 'sell', '2026-01-01', 1, 60000)
          ]);
          openRec();
          var st = L.loadState();
          // Swap the two buys, keep the sell last.
          var res = L.applyTradeReorder(st, 'rs-acct', '2026-01-01', ['rs-b2', 'rs-b1', 'rs-s1']);
          assert(res.ok, 'a funded same-date order must be accepted');
          assert(res.trades[0].id === 'rs-b2' && res.trades[1].id === 'rs-b1', 'the buys must have swapped');
          assert(res.trades[2].id === 'rs-s1', 'the sell must stay last');
          // The engine still books the sell against real holdings.
          var rows = L.computePositions(res.trades, {}, 'average');
          var btc = rows[0];
          assert(btc && Math.abs(btc.qtyHeld - 1) < 1e-9, 'the position must stay 1 BTC, got ' + (btc && btc.qtyHeld));
          // Moving the sell before the buys starves it — refused.
          var bad = L.applyTradeReorder(st, 'rs-acct', '2026-01-01', ['rs-s1', 'rs-b1', 'rs-b2']);
          assert(!bad.ok, 'a sell before its buys must be refused');
          cleanup();
        });

        test('a reorder that starves an outflow is refused', function () {
          // A sell on the same date as the buy it spends, but the sell comes
          // first in the proposed order: the funds are not there yet.
          seed([rec('rs-b1', 'buy', '2026-01-01', 1, 50000), rec('rs-s1', 'sell', '2026-01-01', 2, 60000)]);
          openRec();
          var res = L.applyTradeReorder(L.loadState(), 'rs-acct', '2026-01-01', ['rs-s1', 'rs-b1']);
          assert(!res.ok, 'an order that starves the sell must be refused');
          cleanup();
        });

        test('the same-date rule holds even when the funds arrive on an earlier date', function () {
          // The buy is on an earlier date, so the sell IS funded — but a
          // record may still never swap across a date boundary.
          seed([rec('rs-b1', 'buy', '2026-01-01', 1, 50000), rec('rs-s1', 'sell', '2026-01-02', 1, 60000)]);
          openRec();
          var res = L.applyTradeReorder(L.loadState(), 'rs-acct', '2026-01-01', ['rs-b1', 'rs-s1']);
          assert(!res.ok, 'a record must never move across a date boundary');
          cleanup();
        });

        test('records of one date feed the latest execution on top', function () {
          // Same date, created buy-then-sell: the feed shows the SELL on top
          // (the latest move of the day) and the buy below — the reader reads
          // top-is-latest while the engines walk the same day bottom-up as
          // execution order. Mental model and math agree through the drag's
          // display→execution translation.
          seed([rec('rs-b1', 'buy', '2026-01-01', 1, 50000), rec('rs-s1', 'sell', '2026-01-01', 1, 60000)]);
          openRec();
          assert(cards()[0].getAttribute('data-trade') === 'rs-s1', 'the sell (latest execution) must feed on top');
          assert(cards()[1].getAttribute('data-trade') === 'rs-b1', 'the buy (earlier execution) must sit below');
          cleanup();
        });

        test('a wrapped now-worth pill may run under the buttons', function () {
          seed([rec('rs-b1', 'buy', '2026-01-01', 1, 50000)]);
          try {
            var lp = L.getLivePrices();
            if (lp) lp.BTC = 6;
          } catch (e2) { /* offline shims keep whatever pills exist */ }
          openRec();
          var hdr = document.querySelector('#account-detail .trade-head');
          assert(hdr !== null, 'the head must render');
          var when = hdr.querySelector('.trade-when');
          var pill = hdr.querySelector('.trade-now');
          assert(pill !== null, 'the now-worth pill must render with a known price');
          // Line 1, side by side with the pinned buttons: keep the cap.
          Object.defineProperty(when, 'offsetTop', { value: 0, configurable: true });
          Object.defineProperty(pill, 'offsetTop', { value: 0, configurable: true });
          L.syncTradeHeadRows();
          assert(!pill.classList.contains('head-own-row'), 'a first-line pill keeps the button-corner cap');
          assert(pill.style.marginTop === '', 'a first-line pill is never pushed down');
          // Wrapped below: the corner is free, the pill may run full width.
          // 24px is a row glued under the trio's band where a real layout
          // would push it down; shimmed layouts leave it untouched instead.
          Object.defineProperty(pill, 'offsetTop', { value: 24, configurable: true });
          L.syncTradeHeadRows();
          assert(pill.classList.contains('head-own-row'), 'a wrapped pill must be tagged to run under the buttons');
          // Clearance is measured where the layout knows it (real browsers);
          // shimmed layouts without geometry leave the margin empty instead.
          var mg = pill.style.marginTop;
          assert(mg === '' || (parseFloat(mg) > 0 && /px$/.test(mg)), 'a wrapped pill parks clear of the buttons, got ' + JSON.stringify(mg));
          try {
            var lp2 = L.getLivePrices();
            if (lp2) delete lp2.BTC;
          } catch (e3) { /* ignore */ }
          cleanup();
        });

        test('a line-1 pill whose text crosses the corner is wrapped below', function () {
          seed([rec('rs-b1', 'buy', '2026-01-01', 1, 50000)]);
          try {
            var lp = L.getLivePrices();
            if (lp) lp.BTC = 6;
          } catch (e2) { /* offline shims keep whatever pills exist */ }
          openRec();
          var hdr = document.querySelector('#account-detail .trade-head');
          var when = hdr.querySelector('.trade-when');
          var pill = hdr.querySelector('.trade-now');
          var cluster = hdr.querySelector('.trade-actions');
          assert(pill !== null && cluster !== null, 'pill and pinned cluster must render');
          // Stub the measured corner: trio pinned at 220 of a 320px head, 32px band.
          // The pill starts at x=10 with 260px of uncut text: 10+260 crosses 220.
          // offsetTop emulates the reflow the forcing margin causes: line-1 top
          // while unforced, its own row below the band once the margin exists.
          Object.defineProperty(when, 'offsetTop', { value: 0, configurable: true });
          Object.defineProperty(hdr, 'clientWidth', { value: 320, configurable: true });
          Object.defineProperty(cluster, 'offsetLeft', { value: 220, configurable: true });
          Object.defineProperty(cluster, 'offsetTop', { value: 0, configurable: true });
          Object.defineProperty(cluster, 'offsetHeight', { value: 32, configurable: true });
          Object.defineProperty(pill, 'offsetLeft', { value: 10, configurable: true });
          Object.defineProperty(pill, 'offsetTop', {
            get: function () { return (pill.style.marginRight === '') ? 4 : 31; },
            configurable: true
          });
          Object.defineProperty(pill, 'scrollWidth', { value: 260, configurable: true });
          L.syncTradeHeadRows();
          var mr = pill.style.marginRight;
          assert(parseFloat(mr) > 0 && /px$/.test(mr), 'the crossing pill carries a wrap-forcing right margin, got ' + JSON.stringify(mr));
          // Wrapped and lifted for the row it now owns — never painted over
          // the buttons, and never enlarged: the cap lift works at pill size.
          assert(pill.classList.contains('head-own-row'), 'the wrapped pill carries the lifted-cap tag');
          // Same geometry, shorter text that stops before the corner: no
          // forcing, no push, plain first-line pill.
          Object.defineProperty(pill, 'scrollWidth', { value: 150, configurable: true });
          L.syncTradeHeadRows();
          assert(pill.style.marginRight === '', 'a pill short of the corner stays on line 1');
          assert(pill.style.marginTop === '', 'a fit pill is never pushed down');
          try {
            var lp3 = L.getLivePrices();
            if (lp3) delete lp3.BTC;
          } catch (e4) { /* ignore */ }
          cleanup();
        });

        test('leaving the account drops the record selection', function () {
          seed([rec('rs-b1', 'buy', '2026-01-01', 1, 50000)]);
          openRec();
          head().querySelector('[data-trade-select-btn]').click();
          assert(L.selectedTradeCount() === 0, 'nothing is selected yet');
          var box = document.querySelector('#account-detail .trade-block [data-select-check]');
          box.checked = true;
          box.dispatchEvent(new Event('change', { bubbles: true }));
          assert(L.selectedTradeCount() === 1, 'the record must be selected');
          cleanup();
        });
      } finally {
        try {
          L.cancelTradeSelection();
        } catch (e) { /* ignore */ }
        try {
          if (backup === null) localStorage.removeItem('inoculens.v2');
          else localStorage.setItem('inoculens.v2', backup);
        } catch (e) { /* ignore */ }
        try { navHome(); } catch (e) { /* ignore */ }
        try { render(); } catch (e) { /* ignore */ }
      }
    })();

    renderResults();
  </script>
</body>
