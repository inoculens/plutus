<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INOCULENS PLUTUS — Tests</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="./styles.css">
  <style>
    body { max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
    #summary { font-weight: 600; margin: 1rem 0; }
    #results { list-style: none; padding: 0; }
    #results li { padding: 0.4rem 0.6rem; margin: 0.25rem 0; border-radius: 0.4rem; }
    #results li.pass { background: rgba(0, 200, 0, 0.12); }
    #results li.fail { background: rgba(255, 0, 51, 0.14); }
    #results .err { display: block; font-size: 0.85em; opacity: 0.85; }
  </style>
</head>
<body>
  <header>
    <h1>INOCULENS PLUTUS — Test Harness</h1>
    <p>Browser-native tests for pure functions exposed on <code>window.Inoculens</code>. Later tasks append sections below the Store section.</p>
  </header>

  <main>
    <div id="summary" role="status" aria-live="polite">running…</div>
    <ul id="results"></ul>
    <div id="ui-fixtures">
      <div id="banner" role="status" aria-live="polite" hidden></div>
      <div class="topbar-controls">
        <select id="tb-main">
          <option value="EUR">EUR</option>
          <option value="USD">USD</option>
          <option value="GBP">GBP</option>
          <option value="CHF">CHF</option>
          <option value="RON">RON</option>
        </select>
        <button type="button" id="tb-avg" aria-pressed="true">Average</button>
        <button type="button" id="tb-fifo" aria-pressed="false">FIFO</button>
        <button type="button" id="tb-add">+ Add trade</button>
        <button type="button" id="tb-account">+ Account</button>
        <button type="button" id="tb-sync" class="icon-btn sync-img-btn" hidden aria-label="Sync status"><img id="tb-sync-img" src="/icons/sync-ok.png" alt="" width="20" height="20"></button>
        <button type="button" id="tb-settings">Settings</button>
      </div>
      <p id="tb-totals" class="hero-sub" aria-live="polite"></p>
      <div id="view-home">
        <section id="hero" aria-label="Portfolio total">
          <p class="hero-value" id="hero-value">—</p>
          <p class="hero-invested" id="hero-invested"></p>
          <p class="hero-spent" id="hero-spent"></p>
          <p class="hero-pl" id="hero-pl"></p>
          <div class="hero-alloc" id="hero-alloc" hidden></div>
        </section>
        <section id="overview" aria-label="Summary"><div class="cards" id="summary-cards"></div></section>
        <section id="accounts" aria-label="Accounts"></section>
      </div>
      <div id="view-account" hidden>
        <a href="#/" id="acct-back">‹ Accounts</a>
        <section id="account-detail" aria-label="Account detail"></section>
      </div>
      <dialog id="trade-dialog" aria-labelledby="trade-dialog-title">
        <div class="dialog-head"><h2 id="trade-dialog-title">Add trade</h2></div>
        <div id="trade-dialog-body"></div>
      </dialog>
      <dialog id="account-dialog" aria-labelledby="account-dialog-title">
        <div class="dialog-head"><h2 id="account-dialog-title">New account</h2></div>
        <div id="account-dialog-body"></div>
      </dialog>
      <dialog id="ledger-dialog" aria-labelledby="ledger-dialog-title">
        <div class="dialog-head"><h2 id="ledger-dialog-title">New ledger</h2></div>
        <div id="ledger-dialog-body"></div>
      </dialog>
      <dialog id="settings-dialog" aria-labelledby="settings-dialog-title">
        <div class="dialog-head"><h2 id="settings-dialog-title">Settings</h2></div>
        <div id="settings-dialog-body"></div>
      </dialog>
      <dialog id="confirm-dialog" aria-labelledby="confirm-title">
        <div class="dialog-head"><h2 id="confirm-title">Are you sure?</h2></div>
        <p id="confirm-message" class="muted"></p>
        <div class="dialog-actions">
          <button type="button" id="confirm-cancel">Cancel</button>
          <button type="button" id="confirm-ok" class="primary danger-btn">Confirm</button>
        </div>
      </dialog>
    </div>
  </main>

  <noscript>
    <p>Tests need JavaScript.</p>
  </noscript>

  <script src="./app.js"></script>
  <script>
    'use strict';
    // Minimal harness: test(name, fn), assert(cond, msg). Results render into #results.
    var results = [];
    function assert(cond, msg) {
      if (!cond) throw new Error(msg || 'assertion failed');
    }
    function test(name, fn) {
      var r;
      try {
        r = fn();
      } catch (e) {
        results.push({ name: name, ok: false, error: String((e && e.message) || e) });
        return;
      }
      // Async support (Fx task): a promise-returning fn settles later and re-renders.
      if (r && typeof r.then === 'function') {
        r.then(function () {
          results.push({ name: name, ok: true });
          renderResults();
        }, function (e) {
          results.push({ name: name, ok: false, error: String((e && e.message) || e) });
          renderResults();
        });
      } else {
        results.push({ name: name, ok: true });
      }
    }
    // Serial async queue for network-stubbed tests (final-review hermeticity):
    // the harness invokes all test fns synchronously, so concurrent
    // window.fetch stubs would clobber retry/walkBack continuations. Queued
    // async tests run one-at-a-time; app-side capture (fetchEcbRate /
    // fetchLivePrice capture window.fetch per operation) makes each op
    // hermetic even if stubs overlap.
    var asyncQueue = Promise.resolve();
    function testAsync(name, fn) {
      asyncQueue = asyncQueue.then(function () {
        var r;
        try {
          r = fn();
        } catch (e) {
          results.push({ name: name, ok: false, error: String((e && e.message) || e) });
          renderResults();
          return null;
        }
        if (r && typeof r.then === 'function') {
          return r.then(function () {
            results.push({ name: name, ok: true });
            renderResults();
          }, function (e) {
            results.push({ name: name, ok: false, error: String((e && e.message) || e) });
            renderResults();
          });
        } else {
          results.push({ name: name, ok: true });
          renderResults();
          return null;
        }
      });
    }
    function renderResults() {
      var passed = results.filter(function (r) { return r.ok; }).length;
      var failed = results.length - passed;
      var summary = document.getElementById('summary');
      summary.textContent = passed + ' passed, ' + failed + ' failed (' + results.length + ' tests)';
      summary.dataset.status = failed === 0 ? 'PASS' : 'FAIL';
      var ul = document.getElementById('results');
      ul.innerHTML = '';
      results.forEach(function (r) {
        var li = document.createElement('li');
        li.className = r.ok ? 'pass' : 'fail';
        li.textContent = (r.ok ? 'PASS ' : 'FAIL ') + r.name;
        if (!r.ok) {
          var s = document.createElement('span');
          s.className = 'err';
          s.textContent = r.error;
          li.appendChild(s);
        }
        ul.appendChild(li);
      });
    }

    // === Store tests ===
    (function storeTests() {
      var Store = window.Inoculens || {};
      var loadState = Store.loadState;
      var saveState = Store.saveState;
      var exportState = Store.exportState;
      var importState = Store.importState;

      // Preserve any real user data across the test run; restore afterwards.
      var backup = null;
      try { backup = localStorage.getItem('inoculens.v2'); } catch (e) { backup = null; }
      function restore() {
        try {
          if (backup === null) localStorage.removeItem('inoculens.v2');
          else localStorage.setItem('inoculens.v2', backup);
        } catch (e) { /* ignore */ }
      }

      try {
        test('store round-trip', function () {
          var s = { settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [], priceOverrides: {} };
          saveState(s);
          assert(JSON.stringify(loadState()) === JSON.stringify(s), 'loadState did not return saved state');
        });

        test('export shape', function () {
          var s = { settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [], priceOverrides: {} };
          var out = JSON.parse(exportState(s));
          assert(out.app === 'inoculens-plutus' && out.version === 2 && Array.isArray(out.trades), 'bad envelope: ' + JSON.stringify(out));
          assert(out.settings && out.settings.mainCurrency === 'EUR', 'envelope missing settings');
          assert(typeof out.exportedAt === 'string', 'envelope missing exportedAt');
          assert(Array.isArray(out.accounts), 'envelope missing accounts');
          assert(out.priceOverrides && typeof out.priceOverrides === 'object', 'envelope missing priceOverrides');
          var keys = Object.keys(out).sort();
          assert(JSON.stringify(keys) === JSON.stringify(['accounts', 'app', 'exportedAt', 'priceOverrides', 'settings', 'trades', 'version']),
            'envelope must be exactly {app,version,exportedAt,settings,accounts,trades,priceOverrides}, got ' + JSON.stringify(keys));
        });

        test('corrupt import rejects, state untouched', function () {
          var before = loadState();
          try { importState('not-json'); assert(false, 'should have thrown on non-JSON'); }
          catch (e) { assert(true); }
          assert(JSON.stringify(loadState()) === JSON.stringify(before), 'state changed after rejected import');
          try { importState(JSON.stringify({ app: 'x', version: 99 })); assert(false, 'should have thrown on bad envelope'); }
          catch (e) { assert(true); }
          assert(JSON.stringify(loadState()) === JSON.stringify(before), 'state changed after rejected import');
        });

        test('loadState falls back to defaults', function () {
          try { localStorage.removeItem('inoculens.v2'); } catch (e) { /* ignore */ }
          var d = loadState();
          assert(d.settings.mainCurrency === 'EUR' && d.settings.costMethod === 'average', 'bad default settings');
          assert(!('defaultAccountId' in d.settings), 'settings must not carry defaultAccountId');
          assert(Array.isArray(d.accounts) && d.accounts.length === 0, 'default accounts not empty');
          assert(Array.isArray(d.trades) && d.trades.length === 0, 'default trades not empty');
          try { localStorage.setItem('inoculens.v2', '###corrupt###'); } catch (e) { /* ignore */ }
          var d2 = loadState();
          assert(d2.settings.mainCurrency === 'EUR' && Array.isArray(d2.trades), 'corrupt storage did not fall back');
        });

        test('export/import round-trip identity', function () {
          var s = { settings: { mainCurrency: 'USD', costMethod: 'fifo' }, accounts: [{ id: 'a1', name: 'Cold', ticker: 'BTC', createdAt: '2026-10-06T00:00:00.000Z' }], trades: [{ id: 't1', type: 'buy', symbol: 'BTC', qty: 1, total: 50000, currency: 'USD', date: '2026-01-01', fee: 0, feeCurrency: 'USD', accountId: 'a1', fxLock: { pair: 'USD/USD', rate: 1, source: '1:1' } }], priceOverrides: {} };
          var json = exportState(s);
          try { localStorage.removeItem('inoculens.v2'); } catch (e) { /* ignore */ }
          var back = importState(json);
          assert(back.settings.mainCurrency === 'USD' && back.settings.costMethod === 'fifo', 'imported settings mismatch');
          assert(!('defaultAccountId' in back.settings), 'settings must not carry defaultAccountId');
          assert(Array.isArray(back.accounts) && back.accounts.length === 1 && back.accounts[0].id === 'a1', 'imported accounts mismatch');
          assert(Array.isArray(back.trades) && back.trades.length === 1 && back.trades[0].accountId === 'a1', 'imported trades mismatch');
          assert(JSON.stringify(loadState()) === JSON.stringify(back), 'imported state was not persisted');
        });

        test('priceOverrides export/import round-trip', function () {
          var s = { settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [], priceOverrides: { BTC: 50000, ETH: 3000.5 } };
          var out = JSON.parse(exportState(s));
          assert(JSON.stringify(out.priceOverrides) === JSON.stringify(s.priceOverrides), 'envelope dropped priceOverrides');
          try { localStorage.removeItem('inoculens.v2'); } catch (e) { /* ignore */ }
          var back = importState(JSON.stringify(out));
          assert(JSON.stringify(back.priceOverrides) === JSON.stringify(s.priceOverrides), 'imported priceOverrides mismatch');
          assert(JSON.stringify(loadState()) === JSON.stringify(back), 'imported state was not persisted');
        });

        test('v2 envelope without priceOverrides key imports with {}', function () {
          var noKey = JSON.stringify({ app: 'inoculens-plutus', version: 2, exportedAt: '2026-01-01T00:00:00.000Z', settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [] });
          try { localStorage.removeItem('inoculens.v2'); } catch (e) { /* ignore */ }
          var back = importState(noKey);
          assert(JSON.stringify(back.priceOverrides) === '{}', 'missing key did not default priceOverrides to {}');
          assert(JSON.stringify(loadState()) === JSON.stringify(back), 'imported state was not persisted');
        });

        test('legacy envelope without priceOverrides imports with {}', function () {
          var legacy = JSON.stringify({ app: 'inoculens-plutus', version: 1, exportedAt: '2026-01-01T00:00:00.000Z', settings: { mainCurrency: 'EUR', costMethod: 'fifo' }, trades: [] });
          try { localStorage.removeItem('inoculens.v2'); } catch (e) { /* ignore */ }
          var back = importState(legacy);
          assert(JSON.stringify(back.priceOverrides) === '{}', 'legacy import did not default priceOverrides to {}');
          assert(back.settings.costMethod === 'fifo', 'legacy import lost settings');
        });

        test('invalid priceOverrides rejects, state untouched', function () {
          var before = loadState();
          var bad = JSON.stringify({ app: 'inoculens-plutus', version: 2, exportedAt: '2026-01-01T00:00:00.000Z', settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [], priceOverrides: { BTC: 'high' } });
          try { importState(bad); assert(false, 'should have thrown on non-numeric override'); }
          catch (e) { assert(true); }
          assert(JSON.stringify(loadState()) === JSON.stringify(before), 'state changed after rejected import');
        });

        test('fiat-tagged priceOverrides round-trip, bad shapes reject', function () {
          var s = { settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [], priceOverrides: { BTC: { price: 84892.65, vs: 'EUR' }, ETH: 3000.5 } };
          var out = JSON.parse(exportState(s));
          assert(JSON.stringify(out.priceOverrides) === JSON.stringify(s.priceOverrides), 'envelope dropped tagged overrides');
          try { localStorage.removeItem('inoculens.v2'); } catch (e) { /* ignore */ }
          var back = importState(JSON.stringify(out));
          assert(JSON.stringify(back.priceOverrides) === JSON.stringify(s.priceOverrides), 'tagged overrides must survive round-trip');
          var before = loadState();
          var badShapes = [{ price: -1, vs: 'EUR' }, { price: 1 }, { price: 1, vs: 'xx!' }, { price: 'high', vs: 'EUR' }, [1]];
          for (var i = 0; i < badShapes.length; i++) {
            var bad = JSON.stringify({ app: 'inoculens-plutus', version: 2, exportedAt: '2026-01-01T00:00:00.000Z', settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [], priceOverrides: { BTC: badShapes[i] } });
            try { importState(bad); assert(false, 'should have thrown for bad shape ' + i); }
            catch (e) { assert(true); }
          }
          assert(JSON.stringify(loadState()) === JSON.stringify(before), 'state changed after rejected imports');
        });

        test('import drops exec quotes baked from a live override', function () {
          var backup = null;
          try { backup = localStorage.getItem('inoculens.v2'); } catch (e) { backup = null; }
          try {
            var seed = {
              settings: { mainCurrency: 'RON', costMethod: 'average' },
              accounts: [{ id: 'rp-acct', name: 'Rp', ticker: 'BTC', createdAt: '2026-01-01T00:00:00.000Z' }],
              trades: [{ id: 'rp-a', type: 'buy', symbol: 'BTC', qty: 1, total: 50, currency: 'EUR', date: '2026-01-01', fee: 0, feeCurrency: 'EUR', accountId: 'rp-acct', fxLock: { pair: 'EUR/RON', rate: 4.97, source: 'ECB-2026-01-01' }, execLock: { price: 84892.65, vs: 'RON', source: 'history' } }],
              priceOverrides: { BTC: 84892.65 }
            };
            var back = importState(exportState(seed));
            assert(!('execLock' in back.trades[0]), 'baked copy must be repaired on import, got ' + JSON.stringify(back.trades[0].execLock));
            assert(JSON.stringify(loadState()) === JSON.stringify(back), 'repaired state must persist');
          } finally {
            try {
              if (backup === null) localStorage.removeItem('inoculens.v2');
              else localStorage.setItem('inoculens.v2', backup);
            } catch (e) { /* ignore */ }
            try { render(); } catch (e) { /* ignore */ }
          }
        });
        test('import rejects bad trade shape, state untouched', function () {
          function envelope(trades) {
            return JSON.stringify({ app: 'inoculens-plutus', version: 1, exportedAt: '2026-01-01T00:00:00.000Z', settings: { mainCurrency: 'EUR', costMethod: 'average' }, trades: trades });
          }
          var good = { type: 'buy', symbol: 'BTC', qty: 1, total: 50000, currency: 'EUR', date: '2026-01-01', fee: 0, feeCurrency: 'EUR' };
          function withOver(base, over) {
            var o = {};
            for (var k in base) { if (Object.prototype.hasOwnProperty.call(base, k)) o[k] = base[k]; }
            for (var j in over) { if (Object.prototype.hasOwnProperty.call(over, j)) o[j] = over[j]; }
            return o;
          }
          var badCases = [
            [null],
            ['garbage'],
            [withOver(good, { type: 'hold' })],
            [withOver(good, { symbol: '' })],
            [withOver(good, { qty: 0 })],
            [withOver(good, { total: -1 })],
            [withOver(good, { date: '01-01-2026' })],
            [withOver(good, { fee: -1 })],
            [good, null]
          ];
          for (var i = 0; i < badCases.length; i++) {
            var before = loadState();
            try { importState(envelope(badCases[i])); assert(false, 'should have thrown for bad case ' + i); }
            catch (e) { assert(String((e && e.message) || e).indexOf('import failed') !== -1, 'wrong error for case ' + i + ': ' + ((e && e.message) || e)); }
            assert(JSON.stringify(loadState()) === JSON.stringify(before), 'state changed after rejected trade case ' + i);
          }
          var beforeOk = loadState();
          var okBack = importState(envelope([good]));
          assert(okBack.trades.length === 1 && okBack.trades[0].symbol === 'BTC', 'valid trade should import');
          assert(JSON.stringify(loadState()) !== JSON.stringify(beforeOk) || true, 'persist check');
        });

        test('saveState storage failure throws storage-unavailable + guarded banner', function () {
          var origSetItem = null;
          try { origSetItem = localStorage.setItem; } catch (e) { origSetItem = null; }
          var banner = document.getElementById('banner');
          var threw = false;
          try {
            localStorage.setItem = function () { throw new Error('quota'); };
          } catch (e) { /* read-only storage: skip stub, still assert typed path exists */ }
          try {
            try {
              saveState({ settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [], priceOverrides: {} });
            } catch (e) {
              threw = !!(e && e.message === 'storage-unavailable');
            }
            assert(threw, 'saveState should throw Error(storage-unavailable) on setItem failure');
            var guarded = (window.Inoculens || {}).saveStateGuarded;
            assert(typeof guarded === 'function', 'saveStateGuarded missing');
            if (banner) { banner.hidden = true; banner.textContent = ''; }
            var ok = guarded({ settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [], priceOverrides: {} });
            assert(ok === false, 'saveStateGuarded should return false on storage failure');
            assert(banner && banner.hidden === false && banner.textContent.indexOf('Storage unavailable') !== -1, 'guarded failure must surface via banner');
          } finally {
            try { localStorage.setItem = origSetItem; } catch (e) { /* ignore */ }
            try { if (banner) { banner.hidden = true; banner.textContent = ''; } } catch (e) { /* ignore */ }
          }
        });
      } finally {
        restore();
      }
    })();

    // === Cash-ledger tests (bookkeeping: ledgers on cash accounts) ===
    (function cashLedgerTests() {
      var L = window.Inoculens || {};
      var backup = null;
      try { backup = localStorage.getItem('inoculens.v2'); } catch (e) { backup = null; }
      function restore() {
        try {
          if (backup === null) localStorage.removeItem('inoculens.v2');
          else localStorage.setItem('inoculens.v2', backup);
        } catch (e) { /* ignore */ }
      }
      function v2env(trades, settingsOver) {
        var settings = { mainCurrency: 'EUR', costMethod: 'average' };
        if (settingsOver) for (var k in settingsOver) { if (Object.prototype.hasOwnProperty.call(settingsOver, k)) settings[k] = settingsOver[k]; }
        return JSON.stringify({ app: 'inoculens-plutus', version: 2, exportedAt: '2026-01-01T00:00:00.000Z', settings: settings, accounts: [{ id: 'cash1', name: 'Cash', ticker: 'EUR', kind: 'cash', createdAt: '2026-01-01T00:00:00.000Z' }, { id: 'cash2', name: 'Bucks', ticker: 'USD', kind: 'cash', createdAt: '2026-01-01T00:00:00.000Z' }], trades: trades, priceOverrides: {} });
      }
      function cashTrade(over) {
        var t = { id: 'x' + Math.random().toString(36).slice(2), type: 'income', symbol: 'EUR', qty: 100, total: 100, currency: 'EUR', date: '2026-01-05', fee: 0, feeCurrency: 'EUR', fxLock: { pair: 'EUR/EUR', rate: 1, source: '1:1' }, accountId: 'cash1', createdAt: '2026-01-05T00:00:00.000Z' };
        if (over) for (var k in over) { if (Object.prototype.hasOwnProperty.call(over, k)) t[k] = over[k]; }
        return t;
      }
      try {
        test('ledger validators accept free-form codes, reject junk', function () {
          assert(L.isValidLedgerCode(undefined) && L.isValidLedgerCode('') && L.isValidLedgerCode('1000'), 'valid codes rejected');
          assert(L.isValidLedgerCode('1110') && L.isValidLedgerCode('3000 VAT'), 'free-form codes rejected');
          assert(!L.isValidLedgerCode('x'.repeat(25)), 'overlong code accepted');
          assert(!L.isValidLedgerCode({}) && !L.isValidLedgerCode(['1000']), 'non-string code accepted');
          assert(L.isValidLedgerLabel(undefined) && L.isValidLedgerLabel('Income from X'), 'valid labels rejected');
          assert(!L.isValidLedgerLabel('x'.repeat(81)), 'overlong label accepted');
        });

        test('import keeps ledger fields + chart labels; trims + uppercases', function () {
          var back = L.importState(v2env([cashTrade({ ledger: ' 1100 ', ledgerLabel: ' Income from X ' })], { ledgerLabels: { '1100': 'Income from X' } }));
          assert(back.trades[0].ledger === '1100', 'ledger not trimmed: ' + JSON.stringify(back.trades[0].ledger));
          assert(back.trades[0].ledgerLabel === 'Income from X', 'label not trimmed');
          assert(back.settings.ledgerLabels && back.settings.ledgerLabels['1100'] === 'Income from X', 'chart labels lost');
        });

        test('import rejects malformed ledger fields, keeps legacy trades valid', function () {
          var before = L.loadState();
          try { L.importState(v2env([cashTrade({ ledger: { evil: 1 } })])); assert(false, 'object ledger should throw'); }
          catch (e) { assert(String((e && e.message) || e).indexOf('import failed') !== -1, 'wrong error: ' + ((e && e.message) || e)); }
          assert(JSON.stringify(L.loadState()) === JSON.stringify(before), 'state changed after rejected ledger');
          var okBack = L.importState(v2env([cashTrade()]));
          assert(okBack.trades.length === 1 && !('ledger' in okBack.trades[0]), 'ledger-less trade must stay valid');
          assert(L.isValidImportTrade({ type: 'buy', symbol: 'BTC', qty: 1, total: 50000, currency: 'EUR', date: '2026-01-01', fee: 0, feeCurrency: 'EUR', accountId: 'a1' }, ['a1']), 'legacy buy rejected');
        });

        test('import drops invalid chart maps, never breaks settings', function () {
          var back = L.importState(v2env([cashTrade()], { ledgerLabels: { '1100': { evil: 1 } } }));
          assert(back.settings && back.settings.mainCurrency === 'EUR', 'settings broken by bad chart');
          assert(!back.settings.ledgerLabels || Object.keys(back.settings.ledgerLabels).length === 0, 'bad chart must be dropped');
        });

        test('cross-fiat transfer trades validate (toQty/toSymbol), junk rejected', function () {

        function restoreAll() {
          window.fetch = origFetch;
          try { S.syncSetPendingRemote(false); } catch (e) { /* ignore */ }
          try {
            var passEl = document.getElementById('sy-pass');
            if (passEl) passEl.value = '';
          } catch (e) { /* ignore */ }
          try {
            if (v2 === null) localStorage.removeItem('inoculens.v2');
            else localStorage.setItem('inoculens.v2', v2);
            if (sy === null) localStorage.removeItem('inoculens.sync.v1');
            else localStorage.setItem('inoculens.sync.v1', sy);
          } catch (e) { /* ignore */ }
          try { render(); } catch (e) { /* ignore */ }
        }
        try { v2 = localStorage.getItem('inoculens.v2'); } catch (e) { v2 = null; }
        try { sy = localStorage.getItem('inoculens.sync.v1'); } catch (e) { sy = null; }
        if (typeof init === 'function') init();
        try { localStorage.removeItem('inoculens.sync.v1'); } catch (e) { /* ignore */ }
        seedXd(10);
        useForm();
        trustWith(S.syncCurrentHash());
        window.fetch = function (url, opts) {
          var m = (opts && opts.method) || 'GET';
          if (m === 'PUT') { puts++; return Promise.resolve({ ok: true, status: 200 }); }
          if (m === 'MKCOL') return Promise.resolve({ ok: true, status: 201 });
          return Promise.resolve({ ok: true, status: 200, text: function () { return Promise.resolve(remoteText); } });
        };
        return remoteEnvFor(999).then(function (env) {
          remoteText = env;
          return S.syncCheckRemoteNow();
        }).then(function (outcome) {
          assert(outcome === 'pulled', 'remote-only check must pull, got ' + outcome);
          return waitFor(function () {
            return document.getElementById('sy-status').textContent.indexOf('Pulled newer changes') !== -1 ? true : null;
          }, 25000, 'pulled status');
        }).then(function () {
          assert(puts === 0, 'auto-pull must not upload, PUTs=' + puts);
          assert(L.loadState().trades[0].total === 999, 'newer drive copy must be adopted');
          assert(!document.getElementById('confirm-dialog').open, 'auto-pull must not prompt');
          assert(S.syncRemotePending() === false, 'pending flag must clear after pull');
          restoreAll();
        }, function (e) {
          restoreAll();
          throw e;
        });
      });

      testAsync('load check stands down on conflict instead of guessing', function () {
        var v2 = null, sy = null;
        var origFetch = window.fetch;
        var puts = 0;
        var remoteText = '';
        function restoreAll() {
          window.fetch = origFetch;
          try { S.syncSetPendingRemote(false); } catch (e) { /* ignore */ }
          try {
            var passEl = document.getElementById('sy-pass');
            if (passEl) passEl.value = '';
          } catch (e) { /* ignore */ }
          try {
            if (v2 === null) localStorage.removeItem('inoculens.v2');
            else localStorage.setItem('inoculens.v2', v2);
            if (sy === null) localStorage.removeItem('inoculens.sync.v1');
            else localStorage.setItem('inoculens.sync.v1', sy);
          } catch (e) { /* ignore */ }
          try { render(); } catch (e) { /* ignore */ }
        }
        try { v2 = localStorage.getItem('inoculens.v2'); } catch (e) { v2 = null; }
        try { sy = localStorage.getItem('inoculens.sync.v1'); } catch (e) { sy = null; }
        if (typeof init === 'function') init();
        try { localStorage.removeItem('inoculens.sync.v1'); } catch (e) { /* ignore */ }
        seedXd(10);
        useForm();
        trustWith(S.syncCurrentHash());
        var s2 = L.loadState();
        s2.trades[0].total = 555;
        L.saveState(s2);
        window.fetch = function (url, opts) {
          var m = (opts && opts.method) || 'GET';
          if (m === 'PUT') { puts++; return Promise.resolve({ ok: true, status: 200 }); }
          if (m === 'MKCOL') return Promise.resolve({ ok: true, status: 201 });
          return Promise.resolve({ ok: true, status: 200, text: function () { return Promise.resolve(remoteText); } });
        };
        return remoteEnvFor(999).then(function (env) {
          remoteText = env;
          return S.syncCheckRemoteNow();
        }).then(function (outcome) {
          assert(outcome === 'conflict', 'both-moved check must report conflict, got ' + outcome);
          return waitFor(function () {
            return document.getElementById('sy-status').textContent.indexOf('Devices disagree') !== -1 ? true : null;
          }, 25000, 'conflict status');
        }).then(function () {
          assert(puts === 0, 'conflict must not upload, PUTs=' + puts);
          assert(L.loadState().trades[0].total === 555, 'conflict must keep local data');
          assert(!document.getElementById('confirm-dialog').open, 'background check must not prompt');

    })();

    // === Now-worth pill tests (display-only fun fact, never booked) ===
    (function nowWorthTests() {
      var L = window.Inoculens || {};
      var FXN = { pair: 'EUR/EUR', rate: 1, source: '1:1', interpolated: false };
      function nwTrade(id, type, qty, total) {
        return { id: id, type: type, symbol: 'BTC', qty: qty, total: total, currency: 'EUR', date: '2026-01-01', fee: 0, feeCurrency: 'EUR', note: '', accountId: 'nw-acct', fxLock: FXN, createdAt: '2026-01-01T00:00:00.000Z' };
      }

      test('tradeNow helpers exposed', function () {
        assert(typeof L.tradeNowValue === 'function', 'tradeNowValue missing');
        assert(typeof L.tradeNowPct === 'function', 'tradeNowPct missing');
        assert(typeof L.tradeNowMeta === 'function', 'tradeNowMeta missing');
        assert(typeof L.tradeNowText === 'function', 'tradeNowText missing');
      });

      test('tradeNowValue needs positive qty and live price, never 0', function () {
        assert(L.tradeNowValue(1, 60000) === 60000, 'qty x price wrong');
        assert(L.tradeNowValue(0.5, 60000) === 30000, 'fractional qty wrong');
        [null, undefined, 0, -5, NaN, 'x'].forEach(function (live, i) {
          assert(L.tradeNowValue(1, live) === null, 'unknown live must stay null (case ' + i + ')');
        });
        [0, -1, null, 'x'].forEach(function (q, i) {
          assert(L.tradeNowValue(q, 60000) === null, 'bad qty must be null (case ' + i + ')');
        });
      });

      test('tradeNowPct is standard P&L math (2 -> 6 is +200%)', function () {
        assert(L.tradeNowPct(2, 6) === 200, '2->6 must be +200%, got ' + L.tradeNowPct(2, 6));
        assert(L.tradeNowPct(2, 1) === -50, '2->1 must be -50%, got ' + L.tradeNowPct(2, 1));
        assert(L.tradeNowPct(100, 100) === 0, 'flat must be 0%');
        assert(L.tradeNowPct(0, 6) === null, 'zero basis must be null (money-only pill)');
        assert(L.tradeNowPct(-5, 6) === null, 'negative basis must be null');
      });

      test('tradeNowMeta hides non-buy/sell and unknown live', function () {
        assert(L.tradeNowMeta({ type: 'transfer', symbol: 'BTC', qty: 1, total: 0, currency: 'EUR', date: '2026-01-01', fee: 0, fxLock: FXN }, 'EUR', 60000) === null, 'transfers get no pill');
        assert(L.tradeNowMeta({ type: 'income', symbol: 'BTC', qty: 1, total: 0, currency: 'EUR', date: '2026-01-01', fee: 0, fxLock: FXN }, 'EUR', 60000) === null, 'income gets no pill');
        assert(L.tradeNowMeta({ type: 'expense', symbol: 'BTC', qty: 1, total: 5, currency: 'EUR', date: '2026-01-01', fee: 0, fxLock: FXN }, 'EUR', 60000) === null, 'expense gets no pill');
        assert(L.tradeNowMeta(nwTrade('nw-u', 'buy', 1, 2), 'EUR', null) === null, 'unknown live must hide the pill');
        assert(L.tradeNowMeta(nwTrade('nw-u2', 'buy', 1, 2), 'EUR', 0) === null, 'zero live must hide the pill');
        var gain = L.tradeNowMeta(nwTrade('nw-g', 'buy', 1, 2), 'EUR', 6);
        assert(gain !== null && gain.now === 6 && gain.then === 2 && gain.pct === 200 && gain.cls === 'trade-now-gain', 'gain meta wrong: ' + JSON.stringify(gain));
        var loss = L.tradeNowMeta(nwTrade('nw-l', 'sell', 1, 2), 'EUR', 1);
        assert(loss !== null && loss.now === 1 && loss.pct === -50 && loss.cls === 'trade-now-loss', 'loss meta wrong: ' + JSON.stringify(loss));
        var flat = L.tradeNowMeta(nwTrade('nw-f', 'buy', 1, 2), 'EUR', 2);
        assert(flat !== null && flat.cls === 'trade-now-flat' && flat.pct === 0, 'flat meta wrong: ' + JSON.stringify(flat));
      });

      test('tradeNowText leads with the delta, then the labelled current value', function () {
        var g = L.tradeNowText(6, 'EUR', 200, 2);
        var gp = g.split('|');
        assert(gp.length === 2, 'delta and current must split on |, got ' + g);
        assert(gp[0].indexOf('+') !== -1 && gp[0].indexOf('4') !== -1, 'gain must lead with +delta, got ' + g);
        assert(gp[1].indexOf('Current') !== -1 && gp[1].indexOf('+200%') !== -1, 'gain must end with Current + pct, got ' + g);
        assert(g.indexOf('·') === -1, 'this pill must not use · anymore: ' + g);
        assert(g.indexOf('▲') === -1 && g.indexOf('increase') === -1 && g.indexOf('decrease') === -1, 'text must stop at the percentage: ' + g);
        var l = L.tradeNowText(1, 'EUR', -50, 2);
        var lp = l.split('|');
        assert(lp.length === 2 && lp[0].indexOf('1') !== -1, 'loss must lead with the delta, got ' + l);
        assert(lp[1].indexOf('Current') !== -1 && lp[1].indexOf('-50%') !== -1, 'loss must end with Current + pct, got ' + l);
        assert(l.indexOf('·') === -1, 'this pill must not use · anymore: ' + l);
        assert(l.indexOf('increase') === -1 && l.indexOf('decrease') === -1, 'text must stop at the percentage: ' + l);
        var m = L.tradeNowText(2, 'EUR', 0, 2);
        assert(m.indexOf('%') === -1 && m.indexOf('Current') !== -1, 'flat must be Current only, got ' + m);
        var z = L.tradeNowText(6, 'EUR', null, 2);
        assert(z.indexOf('%') === -1 && z.indexOf('Current') !== -1, 'null pct must be Current only, got ' + z);
      });

      testAsync('buy/sell cards render the now pill after the type pill; transfers do not', function () {
        var backup = null;
        try { backup = localStorage.getItem('inoculens.v2'); } catch (e) { backup = null; }
        function restore() {
          try {
            if (backup === null) localStorage.removeItem('inoculens.v2');
            else localStorage.setItem('inoculens.v2', backup);
          } catch (e) { /* ignore */ }
          try {
            var lp = (L.getLivePrices && L.getLivePrices()) || {};
            Object.keys(lp).forEach(function (k) { delete lp[k]; });
          } catch (e) { /* ignore */ }
          try { navHome(); } catch (e) { /* ignore */ }
        }
        L.saveState({
          settings: { mainCurrency: 'EUR', costMethod: 'average' },
          accounts: [{ id: 'nw-acct', name: 'Nw BTC', ticker: 'BTC', createdAt: '2026-01-01T00:00:00.000Z' }],
          trades: [
            nwTrade('nw-b1', 'buy', 1, 2),
            nwTrade('nw-s1', 'sell', 1, 2),
            { id: 'nw-t1', type: 'transfer', symbol: 'BTC', qty: 0.5, total: 0, currency: 'EUR', date: '2026-01-02', fee: 0, feeCurrency: 'EUR', note: '', accountId: 'nw-acct', networkFee: 0.0001, fxLock: FXN, createdAt: '2026-01-02T00:00:00.000Z' }
          ],
          priceOverrides: { BTC: 6 }
        });
        if (typeof init === 'function') init();
        return refreshPrices().then(function () {
          render();
          navTo('nw-acct');
          route();
          render();
          try {
            var buy = document.querySelector('#account-detail .trade-block[data-trade="nw-b1"] .trade-head');
            assert(buy !== null, 'buy card must render');
            var pill = buy.querySelector('.trade-now');
            assert(pill !== null, 'buy card must carry the now pill');
            var side = buy.querySelector('.side');
            assert(side !== null && (side.compareDocumentPosition(pill) & Node.DOCUMENT_POSITION_FOLLOWING), 'now pill must sit after the type pill');
            assert(pill.classList.contains('trade-now-gain'), '2->6 must be green, got ' + pill.className);
            assert(pill.textContent.indexOf('Current') !== -1 && pill.textContent.indexOf('|') !== -1 && pill.textContent.indexOf('+200%') !== -1 && pill.textContent.indexOf('increase') === -1 && pill.textContent.indexOf('·') === -1, 'buy pill text wrong: ' + pill.textContent);
            assert(pill.scrollWidth <= pill.clientWidth + 1, 'now pill must fit its full text, got ' + pill.textContent);
            var cs = window.getComputedStyle(pill);
            var bg = /rgba?\(([^)]+)\)/.exec(cs.backgroundColor || '');
            assert(bg !== null, 'now pill must have a background, got ' + cs.backgroundColor);
            var alpha = bg[1].split(',').map(function (x) { return Number(x.trim()); });
            assert((alpha.length >= 4 ? alpha[3] : 1) <= 0.2, 'now pill must stay unfilled like the other pills');
            assert((cs.borderRadius || '').indexOf('999px') !== -1, 'now must be a pill, got ' + cs.borderRadius);
            var sell = document.querySelector('#account-detail .trade-block[data-trade="nw-s1"] .trade-head .trade-now');
            assert(sell !== null, 'sell card must carry the now pill too');
            var xfer = document.querySelector('#account-detail .trade-block[data-trade="nw-t1"] .trade-head .trade-now');
            assert(xfer === null, 'transfer cards get no now pill');
          } finally {
            restore();
            render();
          }
        }, function (e) { restore(); render(); throw e; });
      });
    })();

    // === Trade-type filter tests (per-account record list, view-only) ===
    (function tradeTypeFilterTests() {
      var L = window.Inoculens || {};
      var FXT = { pair: 'EUR/EUR', rate: 1, source: '1:1', interpolated: false };
      function ftTrade(id, type, date) {
        var t = { id: id, type: type, symbol: 'BTC', qty: 1, total: 100, currency: 'EUR', date: date, fee: 0, feeCurrency: 'EUR', note: '', accountId: 'ft-acct', fxLock: FXT, createdAt: date + 'T00:00:00.000Z' };
        if (type === 'transfer') { t.qty = 0.5; t.total = 0; t.networkFee = 0.0001; }
        if (type === 'income') { t.qty = 2; t.total = 50; }
        if (type === 'expense') { t.qty = 0.1; t.total = 5; }
        return t;
      }
      function ftTrades() {
        return [
          ftTrade('ft-buy', 'buy', '2026-01-01'),
          ftTrade('ft-sell', 'sell', '2026-01-02'),
          ftTrade('ft-xfer', 'transfer', '2026-01-03'),
          ftTrade('ft-inc', 'income', '2026-01-04'),
          ftTrade('ft-exp', 'expense', '2026-01-05')
        ];
      }
      function seedFt() {
        L.saveState({
          settings: { mainCurrency: 'EUR', costMethod: 'average' },
          accounts: [{ id: 'ft-acct', name: 'Filtered', ticker: 'BTC', createdAt: '2026-01-01T00:00:00.000Z' }],
          trades: ftTrades(),
          priceOverrides: {}
        });
      }
      function openFt() {
        if (typeof init === 'function') init();
        navTo('ft-acct');
        route();
        render();
      }
      function blocks() {
        return document.querySelectorAll('#account-detail .trade-block[data-trade]').length;
      }

      test('trade type filter helpers exposed', function () {
        assert(typeof L.normalizeTradeTypeFilter === 'function', 'normalizeTradeTypeFilter missing');
        assert(typeof L.tradeTypeFilterFor === 'function', 'tradeTypeFilterFor missing');
        assert(typeof L.setTradeTypeFilter === 'function', 'setTradeTypeFilter missing');
        assert(typeof L.filterTradesByType === 'function', 'filterTradesByType missing');
      });

      test('normalizeTradeTypeFilter cleans input, null means all', function () {
        assert(L.normalizeTradeTypeFilter(null) === null, 'null must stay null');
        assert(L.normalizeTradeTypeFilter(undefined) === null, 'undefined must stay null');
        assert(L.normalizeTradeTypeFilter('buy') === null, 'non-array must be null');
        assert(JSON.stringify(L.normalizeTradeTypeFilter(['buy', 'SELL', 'buy', 'nope', null, ''])) === '["buy","sell"]', 'must lowercase, dedupe and drop junk');
        assert(JSON.stringify(L.normalizeTradeTypeFilter([])) === '[]', 'empty selection must survive (shows the no-match note)');
      });

      test('filterTradesByType picks exactly the selected types', function () {
        var all = ftTrades();
        assert(L.filterTradesByType(all, null).length === 5, 'null must pass everything through');
        var buys = L.filterTradesByType(all, ['buy']);
        assert(buys.length === 1 && buys[0].type === 'buy', 'buy-only wrong: ' + JSON.stringify(buys));
        var both = L.filterTradesByType(all, ['buy', 'sell']);
        assert(both.length === 2, 'buy+sell must pick two, got ' + both.length);
        assert(L.filterTradesByType(all, []).length === 0, 'empty selection must match nothing');
        assert(all.length === 5, 'filter must not mutate the input list');
      });

      test('record filter button sits next to + Record and filters the list only', function () {
        var backup = null;
        try { backup = localStorage.getItem('inoculens.v2'); } catch (e) { backup = null; }
        try {
          L.tradePageSizeSet(25);
          L.tradePageSetFor('ft-acct', 0, 5);
          seedFt();
          openFt();
          var head = document.querySelector('#account-detail .section-head');
          assert(head !== null, 'trades header must render');
          var fbtn = head.querySelector('[data-filter-btn]');
          var add = head.querySelector('.t-add');
          assert(fbtn !== null && add !== null, 'Filter must sit next to + Record');
          assert(add.previousElementSibling === fbtn.closest('.filter-wrap'), 'Filter must sit directly left of + Record');
          assert(fbtn.textContent === 'Filter', 'unfiltered button must read Filter, got ' + fbtn.textContent);
          assert(blocks() === 5, 'unfiltered list must show all 5, got ' + blocks());
          var qty = document.querySelector('#account-detail [data-label="Quantity"]');
          var qtyAll = qty && qty.getAttribute('data-value');
          assert(qtyAll !== null, 'quantity total must render');
          L.setTradeTypeFilter('ft-acct', ['sell']);
          assert(blocks() === 1, 'sell-only must show 1, got ' + blocks());
          assert(document.querySelector('#account-detail .trade-block[data-trade="ft-sell"]') !== null, 'the visible card must be the sell');
          var range = document.querySelector('[data-trade-range]');
          assert(range !== null && range.textContent.indexOf('of 1') !== -1, 'range must read of 1, got ' + (range && range.textContent));
          var fbtn1 = document.querySelector('#account-detail .section-head [data-filter-btn]');
          assert(fbtn1 !== null && fbtn1.textContent === 'Filter · 1', 'button must count the selection, got ' + (fbtn1 && fbtn1.textContent));
          var qty1 = document.querySelector('#account-detail [data-label="Quantity"]');
          assert(qty1 !== null && qty1.getAttribute('data-value') === qtyAll, 'totals must stay global while filtering');
          L.setTradeTypeFilter('ft-acct', ['buy', 'sell']);
          assert(blocks() === 2, 'buy+sell must show 2, got ' + blocks());
          L.setTradeTypeFilter('ft-acct', []);
          assert(blocks() === 0, 'empty selection must show no cards');
          assert(document.querySelector('[data-trade-range]').textContent.indexOf('No records match') !== -1, 'empty selection needs the no-match note');
          L.setTradeTypeFilter('ft-acct', null);
          assert(blocks() === 5, 'clearing must restore all 5');
        } finally {
          try { L.setTradeTypeFilter('ft-acct', null); } catch (e) { /* ignore */ }
          try {
            if (backup === null) localStorage.removeItem('inoculens.v2');
            else localStorage.setItem('inoculens.v2', backup);
          } catch (e) { /* ignore */ }
          L.tradePageSizeSet(25);
          L.tradePageSetFor('ft-acct', 0, 5);
          try { navHome(); } catch (e) { /* ignore */ }
          render();
        }
      });

      test('filter panel checkboxes drive the list like the home filter', function () {
        var backup = null;
        try { backup = localStorage.getItem('inoculens.v2'); } catch (e) { backup = null; }
        function fireChange(el) {
          el.dispatchEvent(new Event('change', { bubbles: true }));
        }
        try {
          L.tradePageSizeSet(25);
          L.tradePageSetFor('ft-acct', 0, 5);
          seedFt();
          openFt();
          document.querySelector('#account-detail .section-head [data-filter-btn]').click();
          var panel = document.querySelector('#account-detail [data-filter-panel]');
          assert(panel !== null && panel.hidden === false, 'Filter click must open the panel');
          var boxes = panel.querySelectorAll('input[type="checkbox"]');
          assert(boxes.length === 6, 'panel must offer All + 5 types, got ' + boxes.length);
          ['sell', 'transfer', 'income', 'expense'].forEach(function (tp) {
            var cb = document.querySelector('#account-detail [data-ttype="' + tp + '"]');
            assert(cb !== null && cb.checked === true, tp + ' must start checked');
            cb.checked = false;
            fireChange(cb);
          });
          assert(blocks() === 1, 'only buys must remain, got ' + blocks());
          assert(document.querySelector('#account-detail .trade-block[data-trade="ft-buy"]') !== null, 'the remaining card must be the buy');
          var all = document.querySelector('#account-detail [data-ttfilter-all]');
          assert(all !== null && all.checked === false, 'All must be unchecked for a partial selection');
          all.checked = true;
          fireChange(all);
          assert(blocks() === 5, 'All must restore every record');
        } finally {
          try { L.setTradeTypeFilter('ft-acct', null); } catch (e) { /* ignore */ }
          try {
            if (backup === null) localStorage.removeItem('inoculens.v2');
            else localStorage.setItem('inoculens.v2', backup);
          } catch (e) { /* ignore */ }
          L.tradePageSizeSet(25);
          L.tradePageSetFor('ft-acct', 0, 5);
          try { navHome(); } catch (e) { /* ignore */ }
          render();
        }
      });

      test('filter interaction never yanks the scroll; navigation still resets it', function () {
        var backup = null;
        try { backup = localStorage.getItem('inoculens.v2'); } catch (e) { backup = null; }
        var scrolls = 0;
        var origScroll = window.scrollTo;
        window.scrollTo = function () { scrolls++; };
        try {
          L.tradePageSizeSet(25);
          L.tradePageSetFor('ft-acct', 0, 5);
          seedFt();
          openFt();
          route();
          var settled = scrolls;
          document.querySelector('#account-detail .section-head [data-filter-btn]').click();
          assert(scrolls === settled, 'opening the filter must keep the scroll position');
          L.setTradeTypeFilter('ft-acct', ['sell']);
          assert(scrolls === settled, 'changing the filter must keep the scroll position');
          L.setTradeTypeFilter('ft-acct', null);
          assert(scrolls === settled, 'clearing the filter must keep the scroll position');
          try { navHome(); } catch (e) { /* ignore */ }
          route();
          navTo('ft-acct');
          route();
          assert(scrolls > settled, 'entering an account must still reset the scroll');
        } finally {
          window.scrollTo = origScroll;
          try { L.setTradeTypeFilter('ft-acct', null); } catch (e) { /* ignore */ }
          try {
            if (backup === null) localStorage.removeItem('inoculens.v2');
            else localStorage.setItem('inoculens.v2', backup);
          } catch (e) { /* ignore */ }
          L.tradePageSizeSet(25);
          L.tradePageSetFor('ft-acct', 0, 5);
          try { navHome(); } catch (e) { /* ignore */ }
          render();
        }
      });
    })();

    renderResults();
